                    properties:
                      id: { type: string, format: uuid }
                      role: { type: string, enum: [SYSTEM, USER, ASSISTANT, TOOL] }
                      eventType: { type: string }
                      content: { type: string }
                      occurredAt: { type: string, format: date-time }
                      conversation:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          title: { type: string, nullable: true }
                  sourceSnapshot:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      summary: { type: string }
                      periodStart: { type: string, format: date-time }
                      periodEnd: { type: string, format: date-time }
                      version: { type: integer, minimum: 1 }
                      status: { type: string, enum: [CURRENT, SUPERSEDED] }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Memories]
      operationId: updateMemoryItem
      summary: 更新长期记忆（本地开发）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, minLength: 1, maxLength: 12000 }
                category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                status: { type: string, enum: [active, superseded, archived, invalidated] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryItem' }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memories]
      operationId: permanentlyDeleteTrashedMemory
      summary: 永久删除回收站中的当前记忆条目（本地开发）
      description: 仅可删除已在回收站的条目。不会改写快照；历史快照中的生成时内容副本与来源记录仍保留，因此这不是对所有历史副本的内容擦除。
      responses:
        '200':
          description: 当前长期记忆条目已永久删除，历史快照被保留
          content:
            application/json:
              schema:
                type: object
                required: [id, permanentlyDeleted, snapshotsPreserved, preservedSnapshotReferences]
                properties:
                  id: { type: string, format: uuid }
                  permanentlyDeleted: { type: boolean, enum: [true] }
                  snapshotsPreserved: { type: boolean, enum: [true] }
                  preservedSnapshotReferences: { type: integer, minimum: 0 }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 只能永久删除已经移入回收站的记忆条目
