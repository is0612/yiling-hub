openapi: 3.0.3
info:
  title: Yiling Hub API
  version: 0.1.0
  description: |
    忆灵小窝（多角色 AI 养成）的初始接口契约。
    当前定义用于前后端协作和 Mock；只有实际实现并测试后，接口才算可用。

    鉴权：除 `/auth/session`、`/auth/login`、`/auth/logout` 外，所有接口都要求服务端会话 Cookie（`yiling_session`，HttpOnly、SameSite=Strict，生产环境 Secure）。未登录返回 401；浏览器跨源/跨站请求返回 403。
    本地开发：只有当服务端处于开发模式、`YILING_LOCAL_API_ENABLED=true`、`YILING_ALLOW_DEV_OWNER_BYPASS` 未关闭、且请求通过 localhost/回环地址访问时，才会以 `DEV_OWNER_ID` 身份运行；生产构建不存在该回退。
servers:
  - url: /api
    description: 当前部署的同源 API
tags:
  - name: Auth
  - name: Characters
  - name: Memories
  - name: Snapshots
  - name: MemorySettings
  - name: Tasks
  - name: Channels
security:
  - sessionCookie: []
paths:
  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前管理员会话状态
      description: "匿名访问返回 200 且 mode 为 anonymous，便于前端决定是否跳转登录页；只有传入失效 Cookie 时才返回 reason=invalid_session。"
      security: []
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      description: 使用用户名和密码换取服务端会话。密码使用 scrypt 校验；连续失败会按用户名与来源地址限流。成功时通过 `Set-Cookie` 下发 HttpOnly、SameSite=Strict 的会话 Cookie。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功，服务端设置会话 Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码不正确，或账号已停用
        '429':
          description: 登录失败次数过多，已被临时限流
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 撤销当前会话并清除 Cookie；没有会话时同样返回 204，避免失效 Cookie 让浏览器卡在已登录状态。
      responses:
        '204':
          description: 已退出并清除会话
  /auth/register:
    post:
      tags: [Auth]
      summary: 邮箱自助注册
      description: "用邮箱创建普通用户账号并自动登录。邮箱即登录标识（同时存入 email 与 username），不发送验证邮件；新密码要求 10 至 128 个字符且同时包含字母和数字。注册默认关闭，需将 YILING_ALLOW_REGISTRATION 设为 true 才开放。"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 100 }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
                displayName: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 注册成功并设置会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 邮箱格式不正确或密码不符合策略
        '403':
          description: 已关闭自助注册
        '409':
          description: 该邮箱已注册
        '429':
          description: 注册尝试过于频繁，已被临时限流
  /auth/password:
    post:
      tags: [Auth]
      summary: 修改管理员密码
      description: "校验当前密码后写入新的 scrypt 哈希。成功后撤销其他所有会话，发起修改的会话保持有效。新密码要求 10 至 128 个字符，且同时包含字母和数字，不能与当前密码相同。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: 密码已更新
          content:
            application/json:
              schema:
                type: object
                required: [changed, revokedSessions]
                properties:
                  changed: { type: boolean }
                  revokedSessions:
                    type: integer
                    minimum: 0
                    description: 本次因改密而注销的其他会话数量
        '400':
          description: 当前密码不正确，或新密码不符合策略（过短、过长、缺少字母或数字、与当前密码相同）
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags: [Auth]
      summary: 列出当前账号的有效登录会话
      description: 只返回未撤销且未过期的会话；会话令牌哈希不会出现在响应中，设备信息由 User-Agent 派生。
      responses:
        '200':
          description: 登录设备列表
          content:
            application/json:
              schema:
                type: object
                required: [mode, sessions]
                properties:
                  mode:
                    type: string
                    enum: [session, local-dev]
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: 撤销指定的登录会话
      description: 只能撤销属于当前账号的会话；其他账号的会话与不存在的会话同样返回 404。撤销当前正在使用的会话时会同时清除 Cookie。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 撤销结果
          content:
            application/json:
              schema:
                type: object
                required: [revoked, currentRevoked]
                properties:
                  revoked: { type: boolean }
                  currentRevoked:
                    type: boolean
                    description: 被撤销的是否是发起请求的会话
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: 退出其他所有设备
      description: 撤销除当前会话外的全部有效会话，当前设备保持登录。
      responses:
        '200':
          description: 已撤销的其他会话数量
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Auth]
      summary: 列出所有账号（仅管理员）
      description: 只返回身份与活动统计（角色数、最后活跃时间），不包含任何对话或记忆内容。
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/users/{userId}:
    patch:
      tags: [Auth]
      summary: 维护账号（仅管理员）
      description: 修改显示名、启用/停用账号、或强制重置密码。不能停用自己的账号，也不能停用最后一个可用管理员。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 120 }
                status: { type: string, enum: [ACTIVE, DISABLED] }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean }
        '400':
          description: 无有效更新内容、密码不符合策略，或试图停用自己 / 最后一个管理员
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels:
    get:
      tags: [Auth]
      summary: 列出渠道连接（仅管理员）
      description: 返回平台连接与角色绑定信息；AppSecret 永不返回。
      responses:
        '200':
          description: 渠道连接列表
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelConnectionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
    post:
      tags: [Auth]
      summary: 创建或更新渠道连接（仅管理员）
      description: |
        支持的平台只有 `qq-onebot`（QQ 小号，OneBot v11）与 `bili`（B站 值班）。
        凭据与 Token 使用 AES-256-GCM 加密后入库，只有渠道适配器可解密，接口不回传。
        QQ 官方机器人渠道（AppID + AppSecret）已于 2026-10-27 下线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [qq-onebot, bili] }
                displayName: { type: string, maxLength: 120 }
                qqNumber: { type: string, maxLength: 100, description: 'qq-onebot 必填' }
                wsUrl: { type: string, maxLength: 500, description: 'qq-onebot 可选，默认 ws://127.0.0.1:3001' }
                httpUrl: { type: string, maxLength: 500, description: 'qq-onebot 可选，默认 http://127.0.0.1:3000' }
                accessToken: { type: string, maxLength: 500, description: 'qq-onebot WS Token' }
                httpToken: { type: string, maxLength: 500, description: 'qq-onebot HTTP Token' }
                replyOnlyWhenMentioned: { type: boolean, description: 'qq-onebot 群聊仅被 @ 时回复' }
                dataHome: { type: string, maxLength: 500, description: 'bili 可选，bili CLI 的配置目录（credential / owner / seen 所在，等价 BILI_CLI_HOME；留空用 %APPDATA%\\bili-cli）' }
                biliBin: { type: string, maxLength: 500, description: 'bili 可选，bili 可执行文件路径' }
      responses:
        '200':
          description: 连接已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/{connectionId}:
    delete:
      tags: [Auth]
      summary: 删除渠道连接（仅管理员）
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels/{connectionId}/bindings:
    post:
      tags: [Auth]
      summary: 绑定角色到渠道连接（仅管理员）
      description: 可选 routingKey 限制到单个群 openid；不填则为该连接的默认绑定。
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [characterId]
              properties:
                characterId: { type: string, format: uuid }
                routingKey: { type: string, maxLength: 255 }
      responses:
        '200':
          description: 绑定结果
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels/{connectionId}/bindings/{bindingId}:
    delete:
      tags: [Auth]
      summary: 解除角色绑定（仅管理员）
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: bindingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已解绑
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags: [Auth]
      summary: 存活探针
      description: 只返回进程存活信息，不依赖数据库，供负载均衡与探活使用。
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version, time]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
                  time: { type: string, format: date-time }
  /admin/health:
    get:
      tags: [Auth]
      summary: 就绪探针（仅管理员）
      description: 返回数据库连通性与任务队列计数（queued / running / succeeded / failed）。
      responses:
        '200':
          description: 健康状态
          content:
            application/json:
              schema:
                type: object
                required: [ok, database, jobs, time]
                properties:
                  ok: { type: boolean }
                  database: { type: string, enum: [up, down] }
                  jobs:
                    type: object
                    properties:
                      queued: { type: integer }
                      running: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                  time: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/audit:
    get:
      tags: [Auth]
      summary: 最近审计活动（仅管理员）
      description: 默认返回鉴权相关审计（登录、登出、注册、改密、撤销会话）；可用 action 精确筛选。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: action
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 审计事件列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, action, createdAt, actor]
                      properties:
                        id: { type: string, format: uuid }
                        action: { type: string }
                        entityType: { type: string, nullable: true }
                        entityId: { type: string, nullable: true }
                        details: { type: object, nullable: true }
                        createdAt: { type: string, format: date-time }
                        actor: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /characters:
    get:
      tags: [Characters]
      summary: 获取角色列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 角色分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Character' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Characters]
      summary: 创建角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      summary: 获取角色详情
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Characters]
      summary: 更新角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterPatch'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Characters]
      summary: 删除角色（实现时必须使用明确的删除/归档策略）
      responses:
        '204':
          description: 删除或归档完成
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/memory-scopes:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取角色的记忆范围（全局、已验证用户、外部身份隔离范围）
      responses:
        '200':
          description: 记忆范围列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MemoryScope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/chat:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      operationId: getCharacterChatHistory
      summary: 获取角色 AI 会话列表和历史消息
      description: 本地开发功能。只返回当前角色全局记忆范围的会话，不读取其他角色或私人记忆范围的会话；会话本身仍归属角色全局范围，但每次回复可以检索当前用户自己的私人记忆。
      parameters:
        - name: conversationId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: 只查询正常会话或归档会话，默认 ACTIVE。
          schema: { type: string, enum: [ACTIVE, ARCHIVED], default: ACTIVE }
        - name: q
          in: query
          required: false
          description: 按会话标题或消息内容搜索，最多 120 个字符。
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 会话列表、选中会话的历史消息与模型配置状态
          content:
            application/json:
              schema:
                type: object
                required: [character, modelConfigured, conversations, selectedConversationId, messages]
                properties:
                  character:
                    type: object
                    required: [id, name, chatModel, chatTemperature, chatMaxTokens, chatApiBaseUrl, chatApiKeyConfigured, chatApiKeySource]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      chatModel: { type: string }
                      chatTemperature: { type: number, minimum: 0, maximum: 2 }
                      chatMaxTokens: { type: integer, minimum: 256, maximum: 8192 }
                      chatApiBaseUrl: { type: string, format: uri }
                      chatApiKeyConfigured: { type: boolean }
                      chatApiKeySource: { type: string, enum: [character, environment, missing] }
                  modelConfigured: { type: boolean }
                  selectedConversationId: { type: string, format: uuid, nullable: true }
                  conversations:
                    type: array
                    items:
                      type: object
                      required: [id, title, messageCount]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        lastMessageAt: { type: string, format: date-time, nullable: true }
                        updatedAt: { type: string, format: date-time }
                        messageCount: { type: integer }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: conversationId 参数格式无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Characters]
      operationId: sendCharacterChatMessage
      summary: 向 AI 角色发送消息并保存对话
      description: 本地开发功能。按当前消息检索匹配的角色全局长期记忆和快照，并合并当前开发用户自己的私人记忆范围；其他人的私人记忆、未验证外部身份的范围和未知范围类型一律不参与检索。模型返回的来源 ID 会通过候选白名单过滤。推荐在网页的角色模型参数中配置 API Base URL、API Key 和模型名称；服务端环境变量可作为默认回退配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageInput'
      responses:
        '201':
          description: 已保存用户消息、模型回复和来源引用
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, title, userMessage, assistantMessage, model, retrieval]
                properties:
                  conversationId: { type: string, format: uuid }
                  title: { type: string }
                  userMessage: { $ref: '#/components/schemas/ChatMessage' }
                  assistantMessage: { $ref: '#/components/schemas/ChatMessage' }
                  model:
                    type: object
                    properties:
                      name: { type: string }
                      provider: { type: string }
                      promptTemplateVersion: { type: string }
                  retrieval:
                    type: object
                    properties:
                      memoriesAvailable: { type: integer }
                      snapshotsAvailable: { type: integer }
                      privateScopeActive:
                        type: boolean
                        description: 当前开发用户在这个角色下已有可读的私人记忆范围时为 true。
        '400':
          description: 消息格式无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 模型调用失败或返回格式无效
        '503':
          description: 模型尚未配置
  /characters/{characterId}/chat/models:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      operationId: listCharacterChatModels
      summary: 拉取角色所配服务商的可用模型
      description: 本地开发功能。使用角色保存的 API Base URL 与已加密 API Key 请求 `GET {baseUrl}/models`，只读，不写入任何配置。服务商没有模型列表接口（404/405/501）时返回 ok=false 且 unsupported=true，界面据此回落到内置模型目录。只认已保存的配置，因此界面会先保存再调用。
      responses:
        '200':
          description: 模型列表拉取结果（业务失败也返回 200，由 ok 区分）
          content:
            application/json:
              schema:
                type: object
                required: [ok, models, message]
                properties:
                  ok: { type: boolean }
                  models:
                    type: array
                    maxItems: 200
                    items: { type: string }
                  message: { type: string }
                  unsupported: { type: boolean }
                  provider: { type: string }
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/chat/test-connection:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Characters]
      operationId: testCharacterChatApiConnection
      summary: 测试角色已保存的模型 API
      description: 本地开发功能。使用角色保存的 API Base URL、已加密 API Key 与模型名称发起一次轻量请求；不保存对话消息。响应不会包含 API Key。
      responses:
        '200':
          description: 连通性测试结果
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  model: { type: string }
                  provider: { type: string }
                  elapsedMs: { type: integer, minimum: 0 }
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/chat/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Characters]
      operationId: exportCharacterChatTranscript
      summary: 分页读取完整角色会话及验证过的来源引用
      description: 本地开发功能。支持读取正常或归档会话，按消息发生时间正序分页；页面可基于该接口导出完整 Markdown 对话。
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 会话分页消息、总数与已保存的记忆来源
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, title, status, page, pageSize, total, messages]
                properties:
                  conversationId: { type: string, format: uuid }
                  title: { type: string }
                  status: { type: string, enum: [ACTIVE, ARCHIVED] }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 分页参数无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Characters]
      operationId: setCharacterChatConversationStatus
      summary: 归档或恢复角色会话
      description: 本地开发功能。归档只改变会话状态，不删除对话消息或模型来源记录，并写入审计日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, ARCHIVED] }
      responses:
        '200':
          description: 会话状态已更新
          content:
            application/json:
              schema:
                type: object
                required: [id, status, updatedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [ACTIVE, ARCHIVED] }
                  updatedAt: { type: string, format: date-time }
        '400':
          description: status 参数无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/timeline:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      operationId: getCharacterMemoryTimeline
      summary: 获取角色的已保存记忆时间线
      description: 本地开发过渡接口。返回数据库中已保存的消息、长期记忆和快照；本机可手动录入记忆与纯文本对话。外部渠道接入、事件自动提炼和模型总结尚未接入。
      responses:
        '200':
          description: 按时间倒序排列的真实时间线记录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, type, title, summary, time, channel, tag, tagTone, source]
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [message, memory, snapshot, event] }
                    title: { type: string }
                    summary: { type: string }
                    time: { type: string }
                    channel: { type: string }
                    tag: { type: string }
                    tagTone: { type: string, enum: [green, purple, blue, amber, gray] }
                    source: { type: string }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取角色的会话列表
