openapi: 3.0.3
info:
  title: Yiling Hub API
  version: 0.1.0
  description: |
    忆灵小窝（多角色 AI 养成）的初始接口契约。
    当前定义用于前后端协作和 Mock；只有实际实现并测试后，接口才算可用。

    鉴权：除 `/auth/session`、`/auth/login`、`/auth/logout` 外，所有接口都要求服务端会话 Cookie（`yiling_session`，HttpOnly、SameSite=Strict，生产环境 Secure）。未登录返回 401；浏览器跨源/跨站请求返回 403。
    本地开发：只有当服务端处于开发模式、`YILING_LOCAL_API_ENABLED=true`、`YILING_ALLOW_DEV_OWNER_BYPASS` 未关闭、且请求通过 localhost/回环地址访问时，才会以 `DEV_OWNER_ID` 身份运行；生产构建不存在该回退。
servers:
  - url: /api
    description: 当前部署的同源 API
tags:
  - name: Auth
  - name: Characters
  - name: Memories
  - name: Snapshots
  - name: MemorySettings
  - name: Tasks
  - name: Channels
  - name: Stickers
security:
  - sessionCookie: []
paths:
  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前管理员会话状态
      description: "匿名访问返回 200 且 mode 为 anonymous，便于前端决定是否跳转登录页；只有传入失效 Cookie 时才返回 reason=invalid_session。"
      security: []
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      description: 使用用户名和密码换取服务端会话。密码使用 scrypt 校验；连续失败会按用户名与来源地址限流。成功时通过 `Set-Cookie` 下发 HttpOnly、SameSite=Strict 的会话 Cookie。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 100 }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功，服务端设置会话 Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码不正确，或账号已停用
        '429':
          description: 登录失败次数过多，已被临时限流
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 撤销当前会话并清除 Cookie；没有会话时同样返回 204，避免失效 Cookie 让浏览器卡在已登录状态。
      responses:
        '204':
          description: 已退出并清除会话
  /auth/register:
    post:
      tags: [Auth]
      summary: 邮箱自助注册
      description: "用邮箱创建普通用户账号并自动登录。邮箱即登录标识（同时存入 email 与 username），不发送验证邮件；新密码要求 10 至 128 个字符且同时包含字母和数字。注册默认关闭，需将 YILING_ALLOW_REGISTRATION 设为 true 才开放。"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 100 }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
                displayName: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 注册成功并设置会话 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 邮箱格式不正确或密码不符合策略
        '403':
          description: 已关闭自助注册
        '409':
          description: 该邮箱已注册
        '429':
          description: 注册尝试过于频繁，已被临时限流
  /auth/password:
    post:
      tags: [Auth]
      summary: 修改管理员密码
      description: "校验当前密码后写入新的 scrypt 哈希。成功后撤销其他所有会话，发起修改的会话保持有效。新密码要求 10 至 128 个字符，且同时包含字母和数字，不能与当前密码相同。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: 密码已更新
          content:
            application/json:
              schema:
                type: object
                required: [changed, revokedSessions]
                properties:
                  changed: { type: boolean }
                  revokedSessions:
                    type: integer
                    minimum: 0
                    description: 本次因改密而注销的其他会话数量
        '400':
          description: 当前密码不正确，或新密码不符合策略（过短、过长、缺少字母或数字、与当前密码相同）
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags: [Auth]
      summary: 列出当前账号的有效登录会话
      description: 只返回未撤销且未过期的会话；会话令牌哈希不会出现在响应中，设备信息由 User-Agent 派生。
      responses:
        '200':
          description: 登录设备列表
          content:
            application/json:
              schema:
                type: object
                required: [mode, sessions]
                properties:
                  mode:
                    type: string
                    enum: [session, local-dev]
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: 撤销指定的登录会话
      description: 只能撤销属于当前账号的会话；其他账号的会话与不存在的会话同样返回 404。撤销当前正在使用的会话时会同时清除 Cookie。
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 撤销结果
          content:
            application/json:
              schema:
                type: object
                required: [revoked, currentRevoked]
                properties:
                  revoked: { type: boolean }
                  currentRevoked:
                    type: boolean
                    description: 被撤销的是否是发起请求的会话
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: 退出其他所有设备
      description: 撤销除当前会话外的全部有效会话，当前设备保持登录。
      responses:
        '200':
          description: 已撤销的其他会话数量
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Auth]
      summary: 列出所有账号（仅管理员）
      description: 只返回身份与活动统计（角色数、最后活跃时间），不包含任何对话或记忆内容。
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/users/{userId}:
    patch:
      tags: [Auth]
      summary: 维护账号（仅管理员）
      description: 修改显示名、启用/停用账号、或强制重置密码。不能停用自己的账号，也不能停用最后一个可用管理员。
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, maxLength: 120 }
                status: { type: string, enum: [ACTIVE, DISABLED] }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean }
        '400':
          description: 无有效更新内容、密码不符合策略，或试图停用自己 / 最后一个管理员
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels:
    get:
      tags: [Auth]
      summary: 列出渠道连接（仅管理员）
      description: |
        返回平台连接与角色绑定信息。
        默认**不带**凭据明文（首屏 SSR 会把返回值写进页面 HTML）。
        加 `?withCredentials=1` 才解密回显 qq-onebot 的 wsUrl / httpUrl / accessToken / httpToken
        供管理员核对，解不开时为 null。角色模型 API Key 不在此列，永不回传。
      responses:
        '200':
          description: 渠道连接列表
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelConnectionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
    post:
      tags: [Auth]
      summary: 创建或更新渠道连接（仅管理员）
      description: |
        支持的平台只有 `qq-onebot`（QQ 小号，OneBot v11）与 `bili`（B站 值班）。
        凭据与 Token 使用 AES-256-GCM 加密后入库，只有渠道适配器可解密，接口不回传。
        QQ 官方机器人渠道（AppID + AppSecret）已于 2026-10-27 下线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [qq-onebot, bili] }
                displayName: { type: string, maxLength: 120 }
                qqNumber: { type: string, maxLength: 100, description: 'qq-onebot 必填' }
                wsUrl: { type: string, maxLength: 500, description: 'qq-onebot 可选，默认 ws://127.0.0.1:3001' }
                httpUrl: { type: string, maxLength: 500, description: 'qq-onebot 可选，默认 http://127.0.0.1:3002' }
                accessToken: { type: string, maxLength: 500, description: 'qq-onebot WS Token' }
                httpToken: { type: string, maxLength: 500, description: 'qq-onebot HTTP Token' }
                snowlumaPassword: { type: string, maxLength: 200, description: 'qq-onebot SnowLuma 面板登录密码，用于后台自动配节点；留空 = 沿用原值，解不开时当没填' }
                replyOnlyWhenMentioned: { type: boolean, description: 'qq-onebot 群聊仅被 @ 时回复（连接级默认值；角色绑定未写 groupChatMode 时用它兜底）' }
                groupAnnouncementEnabled: { type: boolean, description: 'qq-onebot 是否允许群主/管理员让她拟群公告草稿（默认 false；确认后才发布）' }
                groupBiliRunEnabled: { type: boolean, description: 'qq-onebot 是否允许主人在群里让她刷一轮 B站（默认 false）' }
                ownerQq: { type: string, maxLength: 20, description: 'qq-onebot 主人 QQ 号；群里的 B站 指令只认这个号，留空 = 未设置' }
                ownerName: { type: string, maxLength: 60, description: 'qq-onebot 主人称呼；写入对话上下文，留空时用外部身份/群名片' }
                dataHome: { type: string, maxLength: 500, description: 'bili 可选，bili CLI 的配置目录（credential / owner / seen 所在，等价 BILI_CLI_HOME；留空用 %APPDATA%\\bili-cli）' }
                biliBin: { type: string, maxLength: 500, description: 'bili 可选，bili 可执行文件路径' }
      responses:
        '200':
          description: 连接已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConnectionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/{connectionId}:
    delete:
      tags: [Auth]
      summary: 删除渠道连接（仅管理员）
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels/{connectionId}/reload:
    post:
      tags: [Auth]
      summary: 请求 QQ 适配器重新读取设置并连接（仅管理员）
      description: |
        将 onebotReloadRequestedAt 原子写入连接 metadata，由独立运行的新版
        yarn onebot:run 进程消费；不执行系统命令、不启动进程。
        metadata.onebotReloadAppliedAt 与请求一致表示已用该配置连接过网关，当前连通以 status 为准。
        适配器未运行时请求保持等待，首次启动或旧版进程升级需人工启动一次。
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 请求已持久化，尚不代表重连成功
          content:
            application/json:
              schema:
                type: object
                required: [requestedAt, message]
                properties:
                  requestedAt: { type: string, format: date-time }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          description: QQ 连接不存在或已停用
  /admin/channels/onebot/runtime:
    get:
      tags: [Auth]
      summary: QQ 渠道链路现状（仅管理员）
      description: |
        一次返回三件事：SnowLuma（协议端网关，面板端口在听即运行）、
        适配器（yarn onebot:run，靠「我在跑」标记 + pid 探活）、
        gateway（适配器要连的 WS 端口通不通）。另带 `autostart`：
        人点过「停止」后自动补起会关着，直到再点启动/重连。
      responses:
        '200':
          description: 链路现状
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter: { type: object, properties: { running: { type: boolean }, pid: { type: integer }, startedAt: { type: string } } }
                  snowluma: { type: object, properties: { home: { type: string }, source: { type: string }, installed: { type: boolean }, running: { type: boolean }, panelPort: { type: integer } } }
                  gateway: { type: object, nullable: true, properties: { wsUrl: { type: string }, host: { type: string }, port: { type: integer }, reachable: { type: boolean } } }
                  autostart: { type: object, properties: { paused: { type: boolean }, at: { type: string } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/onebot/runtime/ensure:
    post:
      tags: [Auth]
      summary: 补齐 QQ 链路（仅管理员）
      description: |
        协议端 → 节点对齐 → 适配器，只补缺的那一段，本来在跑就不动。
        点过「停止」时跳过（返回 skipped/paused）。幂等、带并发锁。
      responses:
        '200':
          description: 补齐结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string, enum: [already-running, started, partial, skipped, starting] }
                  reason: { type: string }
                  steps: { type: array, items: { type: string } }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/onebot/runtime/stop:
    post:
      tags: [Auth]
      summary: 停掉整条 QQ 链路（仅管理员）
      description: |
        先适配器、后协议端，按 pid 树 taskkill /T /F 收干净。并落「自动补起」开关，
        之后重启 server / 刷新页面都不会把刚停的东西又拉起来，直到再点启动/重连。
      responses:
        '200':
          description: 停止结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  stopped: { type: boolean }
                  message: { type: string }
                  adapter: { type: object }
                  snowluma: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/onebot/runtime/provision:
    post:
      tags: [Auth]
      summary: 用存下的面板密码对齐 SnowLuma 节点（仅管理员）
      description: |
        只对齐端口 / 消息格式 / 角色 / 令牌，不碰其他设置。面板没起、密码没填、密码不对都如实返回，
        不做重试（面板按 IP 锁 5 次）。无密码时返回 200 + reason=no-password，不当错误弹。
      responses:
        '200':
          description: 对齐结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reason: { type: string }
                  changes: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/onebot/runtime/hook:
    post:
      tags: [Auth]
      summary: 把这个 QQ 号挂到 SnowLuma 面板上（仅管理员）
      description: |
        面板在跑 ≠ 3001/3002 在听：两个 OneBot 节点只在这个号的会话建立后才 listen，而会话来自
        注入进 QQ 客户端的 hook。这里用存下的面板密码登录，`GET /api/processes` 里按 `account.uin`
        精确挑出这个号的进程，再 `POST /api/processes/:pid/load` 注入（已注入但会话掉了则 refresh），
        等 WS 端口起来后返回。挑不到这个号就失败，不会往别的 QQ 里注入。
        没填密码 / 密码不对 / 号不在线都返回 200 + ok=false，不重试（面板按 IP 锁 5 次）。
      responses:
        '200':
          description: 挂载结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  action: { type: string, enum: [already, attached, failed] }
                  message: { type: string }
                  uin: { type: string }
                  panelPort: { type: integer }
                  wsPort: { type: integer, nullable: true }
                  reachable: { type: boolean }
        '400':
          description: 没找到 SnowLuma / 没有连接 / 连接里没填 QQ 号
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '409':
          description: 面板还没应答
  /admin/channels/onebot/runtime/adapter:
    post:
      tags: [Auth]
      summary: 启动适配器（仅管理员）
      description: 打开命令行窗口跑 yarn onebot:run；已在跑时 409。同时撤销「自动补起」开关。
      responses:
        '200':
          description: 窗口已开
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string }, pid: { type: integer } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '409':
          description: 已在运行
    delete:
      tags: [Auth]
      summary: 停止适配器（仅管理员）
      description: 按 pid 树收干净并删除 pid 文件。单独停某一段用，整条停用 /runtime/stop。
      responses:
        '200':
          description: 停止结果
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, stopped: { type: boolean }, pids: { type: array, items: { type: integer } }, message: { type: string } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
  /admin/channels/onebot/runtime/snowluma:
    post:
      tags: [Auth]
      summary: 启动 SnowLuma（仅管理员）
      description: 在它自己的目录跑 start.bat；没装时 400、已在跑时 409。同时撤销「自动补起」开关。
      responses:
        '200':
          description: 窗口已开
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string }, pid: { type: integer } } }
        '400':
          description: 没找到 start.bat
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '409':
          description: 已在运行
    delete:
      tags: [Auth]
      summary: 停止 SnowLuma（仅管理员）
