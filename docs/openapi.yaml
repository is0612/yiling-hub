      operationId: listMemoryJobs
      summary: 查询当前本地开发用户的持久化后台任务
      description: 本地开发过渡接口；仅返回当前本地开发用户拥有的角色任务，最多返回最近 100 条。
      parameters:
        - name: status
          in: query
