        '201':
          description: 会话已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Conversation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/conversations/import:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Memories]
      operationId: importCharacterTranscript
      summary: 在本地开发环境手动录入纯文本对话
      description: 仅限 localhost 的开发过渡接口。未提供 occurredAt 的消息会用导入时间附近的毫秒偏移保留输入顺序，不代表原始消息时间；不会调用模型。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                title: { type: string, maxLength: 255 }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [USER, ASSISTANT] }
                      content: { type: string, minLength: 1, maxLength: 12000 }
                      occurredAt: { type: string, format: date-time }
      responses:
        '201':
          description: 对话及消息已保存
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, title, messageCount, timestampsEstimated]
                properties:
                  conversationId: { type: string, format: uuid }
                  title: { type: string }
                  messageCount: { type: integer }
                  timestampsEstimated: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages:
