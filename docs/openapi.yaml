          description: 会话分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Conversation' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
