  /characters/{characterId}/proactive:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Proactive]
      operationId: getCharacterProactiveStatus
      summary: 主动找话的现状
      description: |
        返回设置、此刻能不能发（与后台 tick 使用同一把闸门）、待发池条数与最近几条想法。
        `group` 是 QQ 群「冷场了自己找话题」的现状，与私聊那条链各自独立。
        设置本身通过 `PATCH /characters/{characterId}` 的 `proactive` / `groupInitiative` 字段写入。
      responses:
        '200':
          description: 设置与状态
          content:
            application/json:
              schema:
                type: object
                required: [settings, status, recent, group]
                properties:
                  settings: { $ref: '#/components/schemas/ProactiveSettings' }
                  group:
                    type: object
                    required: [settings, status]
                    properties:
                      settings: { $ref: '#/components/schemas/GroupInitiativeSettings' }
                      status:
                        type: object
                        required: [canSendNow, reason, reasonLabel, groups]
                        properties:
                          canSendNow: { type: boolean }
                          reason: { type: string }
                          reasonLabel: { type: string }
                          quotaExceeded: { type: boolean }
                          groups:
                            type: array
                            description: 她待过（有过消息）的群，按最冷排序，最多 10 个。
                            items:
                              type: object
                              required: [groupId, idleMinutes, sentToday, canSendNow, reason, reasonLabel]
                              properties:
                                groupId: { type: string }
                                idleMinutes: { type: integer, minimum: 0 }
                                sentToday: { type: integer, minimum: 0 }
                                lastInitiativeAt: { type: string, format: date-time, nullable: true }
                                canSendNow: { type: boolean }
                                reason: { type: string }
                                reasonLabel: { type: string }
                  status:
                    type: object
                    required: [sentToday, pendingCount, canSendNow, reason, reasonLabel]
                    properties:
                      sentToday: { type: integer, minimum: 0 }
                      pendingCount: { type: integer, minimum: 0 }
                      recipient:
                        type: string
                        nullable: true
                        description: 脱敏后的收件人；null 表示还没有可投递的 QQ 私聊。
                      lastSentAt: { type: string, format: date-time, nullable: true }
                      gapRemainingMinutes: { type: integer, minimum: 0 }
                      quietNow: { type: boolean }
                      quotaExceeded: { type: boolean }
                      canSendNow: { type: boolean }
                      reason: { type: string }
                      reasonLabel: { type: string, description: 已翻译成中文的原因 }
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [SHARE, ASK, INVITE, CONFIDE, CURIOUS, FOLLOWUP] }
                        goal: { type: string }
                        status: { type: string, enum: [PENDING, SENT, SKIPPED, EXPIRED] }
                        content: { type: string, nullable: true }
                        confidence: { type: number }
                        sentAt: { type: string, format: date-time, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/proactive/try:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Proactive]
      operationId: tryCharacterProactive
      summary: 立即试一次
