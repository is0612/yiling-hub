  /admin/channels/{connectionId}/bindings:
    post:
      tags: [Auth]
      summary: 绑定角色到渠道连接（仅管理员）
      description: 可选 routingKey 限制到一个或多个群 openid（逗号分隔，也接受字符串数组）；不填则为该连接的默认绑定。
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [characterId]
              properties:
                characterId: { type: string, format: uuid }
                routingKey: { type: string, maxLength: 255, description: '逗号分隔的多个群号，例如 "12345,67890"；也接受字符串数组。留空或不传 = 默认绑定（收所有群 + 私聊）。' }
                replyWindowMinutes: { type: integer, minimum: 1, maximum: 1440, description: '群聊限流窗口（分钟），默认 10。' }
                replyLimitPerWindow: { type: integer, minimum: 0, maximum: 100, description: '窗口内最多回复几条；0 = 不限。第 N+1 条起静默。' }
                replyLimitPer10Min: { type: integer, minimum: 0, maximum: 100, description: '兼容旧字段，等价于 replyWindowMinutes=10 的 replyLimitPerWindow。' }
                groupChatMode: { type: string, enum: [mention, ambient, all], description: '群聊怎么回：mention 仅被 @（不攒批）；ambient 自然接话（默认，攒一批再判、可不说话）；all 每句都回。' }
                minGapSeconds: { type: integer, minimum: 0, maximum: 3600, description: '自然接话两条之间的最短间隔（秒）。' }
                dailyMax: { type: integer, minimum: 0, maximum: 1000, description: '自然接话每天最多说几句（按群，东八区日界；0 = 不限）。' }
                ambientChance: { type: number, minimum: 0, maximum: 1, description: '跟她无关的闲聊被考虑进去的概率（0-1）。' }
                quietStart: { type: string, description: '安静时段起点 HH:MM，允许跨午夜。' }
                quietEnd: { type: string, description: '安静时段终点 HH:MM。' }
                groupAliases: { type: string, maxLength: 200, description: '群里怎么叫她，逗号分隔；没 @ 但叫到这些名字也算在跟她说话。' }
                replyOnlyWhenMentioned: { type: boolean, description: '兼容旧字段：true = mention，false = ambient（不再是「全都回」，那个要显式传 groupChatMode=all）。' }
      responses:
        '200':
          description: 绑定结果
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 仅管理员可访问
        '404':
          $ref: '#/components/responses/NotFound'
