      operationId: enqueueDueMemoryJobs
      summary: 扫描到期周期并排入持久化任务队列（本地开发）
      description: 处理到期的周期边界并使用幂等键将任务写入持久化队列。真实模型调用由独立 Worker 完成。
      responses:
