openapi: 3.0.3
info:
  title: Yiling Hub API
  version: 0.1.0
  description: |
    多角色 AI 养成中枢的初始接口契约。
    当前定义用于前后端协作和 Mock；只有实际实现并测试后，接口才算可用。
servers:
  - url: /api
    description: 当前部署的同源 API
tags:
  - name: Auth
  - name: Characters
  - name: Memories
  - name: Snapshots
  - name: MemorySettings
  - name: Tasks
  - name: Channels
security:
  - sessionCookie: []
paths:
  /auth/session:
    get:
      tags: [Auth]
      summary: 获取当前管理员会话状态
      security: []
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: 管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功，服务端设置会话 Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses:
        '204':
          description: 已退出并清除会话
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters:
    get:
      tags: [Characters]
      summary: 获取角色列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 角色分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Character' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Characters]
      summary: 创建角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      summary: 获取角色详情
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Characters]
      summary: 更新角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterPatch'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Character' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Characters]
      summary: 删除角色（实现时必须使用明确的删除/归档策略）
      responses:
        '204':
          description: 删除或归档完成
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/memory-scopes:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取角色的记忆范围（全局、已验证用户、外部身份隔离范围）
      responses:
        '200':
          description: 记忆范围列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MemoryScope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/timeline:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      operationId: getCharacterMemoryTimeline
      summary: 获取角色的已保存记忆时间线
      description: 本地开发过渡接口。返回数据库中已保存的消息、长期记忆和快照；本机可手动录入记忆与纯文本对话。外部渠道接入、事件自动提炼和模型总结尚未接入。
      security: []
      responses:
        '200':
          description: 按时间倒序排列的真实时间线记录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, type, title, summary, time, channel, tag, tagTone, source]
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [message, memory, snapshot, event] }
                    title: { type: string }
                    summary: { type: string }
                    time: { type: string }
                    channel: { type: string }
                    tag: { type: string }
                    tagTone: { type: string, enum: [green, purple, blue, amber, gray] }
                    source: { type: string }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取角色的会话列表
      parameters:
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 会话分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Conversation' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Memories]
      summary: 创建角色会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationInput'
      responses:
        '201':
          description: 会话已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Conversation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/conversations/import:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Memories]
      operationId: importCharacterTranscript
      summary: 在本地开发环境手动录入纯文本对话
      description: 仅限 localhost 的开发过渡接口。未提供 occurredAt 的消息会用导入时间附近的毫秒偏移保留输入顺序，不代表原始消息时间；不会调用模型。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                title: { type: string, maxLength: 255 }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [USER, ASSISTANT] }
                      content: { type: string, minLength: 1, maxLength: 12000 }
                      occurredAt: { type: string, format: date-time }
      responses:
        '201':
          description: 对话及消息已保存
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, title, messageCount, timestampsEstimated]
                properties:
                  conversationId: { type: string, format: uuid }
                  title: { type: string }
                  messageCount: { type: integer }
                  timestampsEstimated: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Memories]
      summary: 获取会话原始消息
      parameters:
        - name: before
          in: query
          description: 可选的时间游标，按发生时间倒序分页时使用。
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 消息分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Message' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memories]
      summary: 写入标准化的原始消息或事件
      description: 外部渠道适配器后续可调用同一内部服务；生产实现必须进行来源鉴权与重复消息去重。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '201':
          description: 消息已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Message' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/memories:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取长期记忆列表
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 记忆列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MemoryItem' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Memories]
      operationId: createCharacterMemory
      summary: 手动创建长期记忆（本地开发）
      description: 仅限 localhost 的开发过渡接口；创建的条目默认 ACTIVE，并立即显示在角色时间线中。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, category]
              properties:
                content: { type: string, minLength: 1 }
                category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                scopeId: { type: string, format: uuid }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 该接口仅限本地开发环境
  /memories/{memoryId}/trash:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Memories]
      operationId: moveMemoryToTrash
      summary: 将长期记忆移入回收站（本地开发）
      description: 保留移入前的状态与时间戳；已有快照保持不变。
      security: []
      responses:
        '200':
          description: 已移入回收站
          content:
            application/json:
              schema:
                type: object
                required: [id, status, statusBeforeTrash, deletedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [TRASHED] }
                  statusBeforeTrash: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  deletedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 记忆已在回收站
  /memories/{memoryId}/restore:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Memories]
      operationId: restoreMemoryFromTrash
      summary: 从回收站恢复长期记忆（本地开发）
      description: 恢复到移入回收站之前的记忆状态。
      security: []
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                type: object
                required: [id, status, statusBeforeTrash, deletedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  deletedAt: { type: string, nullable: true, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 记忆不在回收站
  /memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Memories]
      operationId: getMemoryItem
      summary: 获取长期记忆详情（本地开发）
      description: 仅限 localhost 的开发过渡接口，且只允许读取当前本地开发用户拥有角色下的记忆。
      security: []
      responses:
        '200':
          description: 记忆详情
          content:
            application/json:
              schema:
                type: object
                required: [id, category, content, status, createdAt, updatedAt]
                properties:
                  id: { type: string, format: uuid }
                  category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                  content: { type: string }
                  status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED, TRASHED] }
                  confidence: { type: number, nullable: true }
                  statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  deletedAt: { type: string, nullable: true, format: date-time }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Memories]
      operationId: updateMemoryItem
      summary: 更新长期记忆（本地开发）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, minLength: 1, maxLength: 12000 }
                category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                status: { type: string, enum: [active, superseded, archived, invalidated] }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryItem' }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memories]
      operationId: permanentlyDeleteTrashedMemory
      summary: 永久删除回收站中的当前记忆条目（本地开发）
      description: 仅可删除已在回收站的条目。不会改写快照；历史快照中的生成时内容副本与来源记录仍保留，因此这不是对所有历史副本的内容擦除。
      security: []
      responses:
        '200':
          description: 当前长期记忆条目已永久删除，历史快照被保留
          content:
            application/json:
              schema:
                type: object
                required: [id, permanentlyDeleted, snapshotsPreserved, preservedSnapshotReferences]
                properties:
                  id: { type: string, format: uuid }
                  permanentlyDeleted: { type: boolean, enum: [true] }
                  snapshotsPreserved: { type: boolean, enum: [true] }
                  preservedSnapshotReferences: { type: integer, minimum: 0 }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 只能永久删除已经移入回收站的记忆条目
  /characters/{characterId}/memories/trash:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      operationId: listCharacterMemoryTrash
      summary: 获取角色记忆回收站（本地开发）
      security: []
      responses:
        '200':
          description: 回收站条目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, category, content, status, statusBeforeTrash, deletedAt]
                  properties:
                    id: { type: string, format: uuid }
                    category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                    content: { type: string }
                    status: { type: string, enum: [TRASHED] }
                    statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                    deletedAt: { type: string, nullable: true, format: date-time }
                    createdAt: { type: string, format: date-time }
                    updatedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Snapshots]
      summary: 获取快照列表
      parameters:
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 快照分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MemorySnapshot' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Snapshots]
      summary: 请求生成手动快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopeId, periodStart, periodEnd]
              properties:
                scopeId: { type: string, format: uuid }
                periodStart: { type: string, format: date-time }
                periodEnd: { type: string, format: date-time }
      responses:
        '202':
          description: 快照任务已排队，自动计划不应被重置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          taskId: { type: string, format: uuid }
                          status: { type: string, enum: [queued] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /snapshots/{snapshotId}:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Snapshots]
      summary: 获取快照版本详情
      responses:
        '200':
          description: 快照详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /snapshots/{snapshotId}/regenerate:
    post:
      tags: [Snapshots]
      summary: 为相同逻辑快照请求生成新版本
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 新版本生成任务已排队；历史版本保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /snapshots/{snapshotId}/versions:
    get:
      tags: [Snapshots]
      summary: 获取逻辑快照的所有版本
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MemorySnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/memory-settings:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [MemorySettings]
      summary: 获取角色记忆设置
      responses:
        '200':
          description: 设置详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [MemorySettings]
      summary: 更新角色记忆周期和相关设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySettings'
      responses:
        '200':
          description: 设置已更新；周期默认于当前周期结束后生效
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySettings' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listMemoryJobs
      summary: 查询当前本地开发用户的持久化后台任务
      description: 本地开发过渡接口；仅返回当前本地开发用户拥有的角色任务，最多返回最近 100 条。
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, RETRY_WAIT, CANCELLED]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, status, attemptCount, maxAttempts, runAt, createdAt, updatedAt, characterId, characterName]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string, enum: [GENERATE_SNAPSHOT, REGENERATE_SNAPSHOT, UPDATE_LONG_TERM_MEMORY, CLEAN_EXPIRED_MESSAGES] }
                        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, RETRY_WAIT, CANCELLED] }
                        attemptCount: { type: integer }
                        maxAttempts: { type: integer }
                        runAt: { type: string, format: date-time }
                        periodStart: { type: string, nullable: true, format: date-time }
                        periodEnd: { type: string, nullable: true, format: date-time }
                        lastError: { type: string, nullable: true }
                        startedAt: { type: string, nullable: true, format: date-time }
                        completedAt: { type: string, nullable: true, format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        characterId: { type: string, format: uuid }
                        characterName: { type: string }
                  total: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
  /tasks/scheduler/run:
    post:
      tags: [Tasks]
      operationId: enqueueDueMemoryJobs
      summary: 扫描到期周期并排入持久化任务队列（本地开发）
      description: 处理到期的周期边界并使用幂等键排队；此操作不执行快照生成，实际 Worker 尚未接入。
      security: []
      responses:
        '200':
          description: 本次扫描统计
          content:
            application/json:
              schema:
                type: object
                required: [settingsChecked, settingsAdvanced, jobsQueued, periodsConsidered, missingGlobalScope, settingsStillDue, note]
                properties:
                  settingsChecked: { type: integer }
                  settingsAdvanced: { type: integer }
                  jobsQueued: { type: integer }
                  periodsConsidered: { type: integer }
                  missingGlobalScope: { type: integer }
                  settingsStillDue: { type: integer }
                  note: { type: string }
        '403':
          description: 该接口仅限本地开发环境
  /tasks/worker/run:
    post:
      tags: [Tasks]
      operationId: runOneMemoryWorkerJob
      summary: 由本地开发界面执行一条周期快照任务（本地开发）
      description: 手动触发单次 Worker 处理。当前仅执行 GENERATE_SNAPSHOT 任务，并生成不调用大模型的规则版结构化快照。
      security: []
      responses:
        '200':
          description: 本次处理结果；processed=false 表示当前没有可执行的任务
          content:
            application/json:
              schema:
                type: object
                required: [processed, message]
                properties:
                  processed: { type: boolean }
                  jobId: { type: string, format: uuid }
                  status: { type: string, enum: [SUCCEEDED, SKIPPED, RETRY_WAIT, FAILED] }
                  snapshotId: { type: string, format: uuid }
                  message: { type: string }
        '403':
          description: 该接口仅限本地开发环境
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tasks]
      summary: 获取任务详情
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryJob' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/retry:
    post:
      tags: [Tasks]
      summary: 重新排队失败任务
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 重试任务已排队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels:
    get:
      tags: [Channels]
      summary: 获取已配置的平台连接
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/channels:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Channels]
      summary: 获取角色绑定的渠道
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yiling_session
  parameters:
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: 未登录或会话无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 请求参数或请求体无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在或当前会话无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [data, error]
      properties:
        data: {}
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                authenticated: { type: boolean }
                username: { type: string, nullable: true }
    MemoryScope:
      type: object
      required: [id, characterId, scopeType, scopeKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        characterId: { type: string, format: uuid }
        scopeType: { type: string, enum: [character_global, user_private, external_identity] }
        scopeKey: { type: string }
        userId: { type: string, format: uuid, nullable: true }
        externalIdentityId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    ConversationInput:
      type: object
      required: [memoryScopeId]
      properties:
        memoryScopeId: { type: string, format: uuid }
        channelBindingId: { type: string, format: uuid, nullable: true }
        externalConversationId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationInput'
        - type: object
          required: [id, characterId, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            characterId: { type: string, format: uuid }
            status: { type: string, enum: [active, archived] }
            lastMessageAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [role, content, occurredAt]
      properties:
        externalMessageId: { type: string, nullable: true }
        role: { type: string, enum: [system, user, assistant, tool] }
        eventType: { type: string, default: message }
        content: { type: string }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageInput'
        - type: object
          required: [id, conversationId, ingestedAt]
          properties:
            id: { type: string, format: uuid }
            conversationId: { type: string, format: uuid }
            ingestedAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [id, type, occurredAt, title]
      properties:
        id: { type: string }
        type: { type: string, enum: [message, memory, snapshot] }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        snapshotVersion: { type: integer, nullable: true }
        details:
          type: object
          additionalProperties: true
    CharacterInput:
      type: object
      required: [name, basePrompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000 }
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
    CharacterPatch:
      type: object
      description: 更新角色时的部分字段；所有字段均为可选。
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000 }
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
    Character:
      allOf:
        - $ref: '#/components/schemas/CharacterInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MemoryItem:
      type: object
      required: [id, category, content, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        category: { type: string }
        content: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED, TRASHED] }
        statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
        deletedAt: { type: string, nullable: true, format: date-time }
        sourceMessageId: { type: string, format: uuid, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    MemorySnapshot:
      type: object
      required: [id, version, periodStart, periodEnd, summary, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        snapshotKey: { type: string }
        scopeId: { type: string, format: uuid }
        kind: { type: string, enum: [automatic, manual] }
        version: { type: integer, minimum: 1 }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        summary: { type: string }
        structuredContent:
          type: object
          properties:
            importantEvents: { type: array, items: { type: object, additionalProperties: true } }
            factsAndPreferences: { type: array, items: { type: object, additionalProperties: true } }
            relationships: { type: array, items: { type: object, additionalProperties: true } }
            commitmentsAndGoals: { type: array, items: { type: object, additionalProperties: true } }
            unresolvedTopics: { type: array, items: { type: object, additionalProperties: true } }
            changesSincePrevious: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [current, superseded] }
        modelMetadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    MemorySettings:
      type: object
      required: [snapshotIntervalDays, timezone, autoSnapshotEnabled]
      properties:
        snapshotIntervalDays: { type: integer, minimum: 1, maximum: 365, default: 8 }
        timezone: { type: string, example: Asia/Shanghai }
        anchorAt: { type: string, format: date-time, nullable: true }
        nextSnapshotAt: { type: string, format: date-time, nullable: true, readOnly: true }
        rawMessageRetentionDays: { type: integer, minimum: 1, nullable: true }
        autoSnapshotEnabled: { type: boolean, default: true }
    MemoryJob:
      type: object
      required: [id, type, status, attemptCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        characterId: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time, nullable: true }
        periodEnd: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [queued, running, succeeded, failed, skipped, retry_wait] }
        attemptCount: { type: integer, minimum: 0 }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
