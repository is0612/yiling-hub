                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memories]
      summary: 写入标准化的原始消息或事件
      description: 外部渠道适配器后续可调用同一内部服务；生产实现必须进行来源鉴权与重复消息去重。
      requestBody:
        required: true
