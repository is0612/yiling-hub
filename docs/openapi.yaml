  /characters/{characterId}/stickers:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Stickers]
      summary: 获取角色的表情包清单
      description: |
        按创建时间升序，返回**裸数组**。这一组接口都不套 `{data, error}` 信封（早期接口那样写，实际实现是裸 JSON）—— 以这里的定义为准。
        **回收站里的不返回**：删掉的表情只是软删，行还在库里，翻回收站走 `/stickers/trash`。
        图片本体不在这里，走 `/stickers/{stickerId}/image` 单独取：图存在 `.data/` 下、不可被 Web 直接访问，且它属于角色的私人素材。
      responses:
        '200':
          description: 表情包清单
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sticker' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Stickers]
      summary: 上传一张表情包
      description: |
        `multipart/form-data`，不用 JSON + base64：图片是二进制，塞进 JSON 要多花三分之一体积。
        上传时会**等比缩到最大宽度 200px**（只缩不放：本来就不宽于 200 的图原样返回、不重编码），
        因为 QQ 桌面端按图片原始像素显示，1500px 的图发出去在聊天窗里会占满一屏。
        动图（GIF/WebP）按帧缩，缩完帧数与帧延时不变；解不开的图存原件，不因为「缩不动」让上传失败。

        **顺手收藏到 QQ**：角色绑了 QQ 号时，这张会被加进那个号的收藏夹（`add_custom_face`），
        并把回传的 `emoji_id` 绑到记录上 —— 用户要的是「两边是同一批表情」，加一张还要再点一次同步就太绕了。
        推失败不影响本地已经加好（下次 `qq-sync` 会补推），结果在响应的 `qq` 字段里。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG / JPG / GIF / WebP，最大 2MB
                filename:
                  type: string
                  description: 原始文件名，**只用于推断扩展名**；磁盘文件名一律由服务端生成 `uuid.ext`，客户端传的名字不进路径
                name:
                  type: string
                  maxLength: 60
                  description: 她挑图时看到的名字。写情绪或动作词（委屈 / 拍桌笑 / 比心），不要写「表情1」
                usage:
                  type: string
                  maxLength: 200
                  description: 什么时候用。可以留空，但挑图模型主要看这一句，空着这张基本轮不上
      responses:
        '200':
          description: 创建成功，返回存下来的那条记录（名字、大小、缩小后的 mimeType）。绑了 QQ 时多一个 `qq` 字段
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sticker'
                  - type: object
                    properties:
                      qq: { $ref: '#/components/schemas/QqSideEffect' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 图片超过 2MB（缩小之后仍然超也算）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '415':
          description: 只支持 PNG / JPG / GIF / WebP，认不出扩展名
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/usage-suggestion:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Stickers]
      summary: 按名字生成一句「什么时候用」（上传框用，图还没入库）
      description: |
        用户常常知道这张图是干什么的（名字起得出来），却写不出场景那句话；而挑图模型真正比对的就是那一句。
        这个入口对应**添加表情包**那一刻 —— 贴纸还没有 id，所以图由浏览器带上来（先缩到 200px 宽再转 data URL）。
        有图且角色开了「看图」就走视觉（名字 + 画面），没开或没带图就只按名字生成。
        **只回建议、不写库**：用户在弹窗里还要改，保存仍走上面的上传接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                  description: 表单里**当前**填的名字（不一定是已保存的那个）
                image:
                  type: string
                  description: |
                    可选，`data:image/...` 形式的缩略图，最长 40 万字符（约 300KB 二进制）。
                    不是 data URL 或太长都会被当成「没带图」，退回只按名字生成 —— 这个接口不是上传通道。
      responses:
        '200':
          description: 生成了一句
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StickerUsageSuggestion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 名字为空，或模型这次给不出能用的场景
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '502':
          description: 上游模型没有返回结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '503':
          description: 角色还没有可用的模型（聊天模型都没配）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/{stickerId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    patch:
      tags: [Stickers]
      summary: 改名字 / 使用场景 / 启用状态
      description: |
        三个字段都是可选的，但至少要给一个（否则 400）。**图不能换** —— 换图等于换一张表情，应该删了重传。

        改了 `name` 而这张在 QQ 收藏夹里也有一份时，会把新名字写成 QQ 那边的备注（`modify_custom_face`）。
        本地改名是主操作，QQ 回写是附带动作：失败只体现在响应的 `qqDesc` 里，不影响本地结果，
        下次 `qq-sync` 还会再写一次（名字以本地为准）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StickerPatch' }
      responses:
        '200':
          description: 更新后的记录。改过名字且绑了 QQ 时多一个 `qqDesc`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sticker'
                  - type: object
                    properties:
                      qqDesc:
                        allOf:
                          - $ref: '#/components/schemas/QqSideEffect'
                        nullable: true
                        description: 没改名、或这张不在 QQ 收藏里时是 `null`
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Stickers]
      summary: 删除一张表情包（进回收站 + 同步删 QQ）
      description: |
        「删」现在是**两边一起删，但本地不真删**：

        1. 行标成 `deletedAt` + `deletedReason: 'local'`，进回收站（图留在磁盘上）—— 直接硬删的话，
           用户下次再收藏回来还得重新打一遍标签，而回收站还能「恢复」；
        2. 这张在 QQ 收藏夹里也有一份时，顺手把 QQ 那张删掉（`delete_custom_face`）。

        QQ 删失败**不算失败**：本地已经进回收站了，下次 `qq-sync` 会给「本地删了、QQ 还在」的那些补删一次。
        结果在响应的 `qq` 字段里。彻底删除走 `/stickers/trash/{stickerId}/purge`。
      responses:
        '200':
          description: 已进回收站
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
                  qq: { $ref: '#/components/schemas/QqSideEffect' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 这张已经在回收站里了
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/qq-sync:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Stickers]
      summary: 与 QQ 收藏夹对一次账（双向同步）
      description: |
        把角色的 QQ 号收藏夹和本地表情库对齐。**手动触发**，不做定时 ——
        一次可能搬几十张图（下载 + 缩图 + 上传），后台悄悄跑完只会让人以为表情库自己变了。

        对账规则（按从严到松匹配）：

        1. `qqEmojiId` 相等 → 同一张，不动；
        2. `qqMd5` 相等但 id 不同 → 同一张图在 QQ 里删了又加（id 会变、md5 不变），只回填 id，
           **不重新导入**，否则本地打好的标签会被一张「新图」顶掉；
        3. 都没有 → 本地有就推上去，QQ 有就导下来。

        另外三个方向：QQ 那边没了的进回收站；本地删过而 QQ 还留着的补删一次；
        名字和 QQ 备注不一致的，把本地的名字写过去（本地为准）。

        **安全阀**：QQ 回 0 条而本地有一堆挂着 `qqEmojiId` 的，两种可能分不清
        （收藏真被清空 / 网关没登录），此时**什么都不做**并置 `ok: false` + 一条 `warnings`。

        需要网关支持 SnowLuma 的收藏表情扩展 action（`fetch_custom_face_detail` 等）；
        网关不支持时返回 400，message 会直说。
      responses:
        '200':
          description: "同步结果。`ok: false` 表示安全阀触发、这次什么都没动（仍返回 200）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StickerSyncReport' }
        '400':
          description: 角色没绑 QQ 号 / 网关连不上 / 网关没有收藏表情接口
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/stickers/trash:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Stickers]
      summary: 回收站列表
      description: |
        删掉的表情不是真删，行标了 `deletedAt`，图还留在磁盘上，这里能看到、能恢复。

        **打开时会顺手清掉超过保留期的**（默认 30 天）：不挂定时任务 —— 回收站是低频页面，
        为删几张图常驻一个调度器不划算，而没人打开的时候那些文件也不碍事。
        响应里的 `purged` 就是这次清掉了几条。
      responses:
        '200':
          description: 回收站内容
          content:
            application/json:
              schema:
                type: object
                required: [items, purged, retentionDays]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Sticker' }
                  purged:
                    type: integer
                    description: 本次顺手清掉的过期条数
                  retentionDays:
                    type: integer
                    description: 保留天数，与页面文案保持一致
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/stickers/trash/{stickerId}/restore:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    post:
      tags: [Stickers]
      summary: 从回收站恢复一张
      description: |
        只动本地。若这张是「QQ 那边删了」才进回收站的，恢复后它就是一张只有本地有的表情，
        下次 `qq-sync` 会把它重新推回 QQ 收藏夹 —— 这正是「我说了算」的意思。
      responses:
        '200':
          description: 恢复后的记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sticker' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 这张不在回收站里
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/trash/{stickerId}/purge:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    delete:
      tags: [Stickers]
      summary: 从回收站里彻底删除
      description: 行和磁盘文件一起清，不可恢复。只对**已经在回收站里**的生效 —— 列表上点删除是软删，两者语义分开。
      responses:
        '200':
          description: 已彻底删除
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 还没进回收站，不能直接彻底删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/{stickerId}/image:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    get:
      tags: [Stickers]
      summary: 取表情包图片本体
      description: 给管理页显示缩略图用。必须走接口而不是静态目录 —— 图在 `.data/` 下，放开静态访问等于把用户私人素材公开。
      responses:
        '200':
          description: 图片字节
          headers:
            Cache-Control:
              schema: { type: string }
              description: 固定为 `private, max-age=300`
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 记录不存在，或图片文件不在本机（换电脑只搬了库、没搬 `.data`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/{stickerId}/relabel:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    post:
      tags: [Stickers]
      summary: 让视觉模型再看一次这张图，重写名字与场景
      description: |
        自动打标经常不准 —— 群里的图没有上下文，只凭画面猜；动图只看到一帧、抽象梗图、带字的图尤其容易错。
        这里用的是**当前存的那份图**（已缩到 200px），那才是她真正会发出去的东西。
        成功即写库并返回新记录（不返回「建议值让前端再提交一次」：点这一下就是「按新的来」）。
        模型判定「这不是表情包」（聊天截图 / 长截图 / 照片）时**不改数据**，只回 `skipped: true` 和一句人话，把删不删的决定交回给用户。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '已重写，或模型判定不是表情包（skipped 为 true）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StickerRelabelResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 模型只给出没有信息量的名字（如「表情包」），这张需要用户自己写
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '502':
          description: 上游模型没有返回结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '503':
          description: 角色没有可用的视觉模型（没开「看图」或没配视觉模型）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
  /characters/{characterId}/stickers/{stickerId}/usage-suggestion:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - $ref: '#/components/parameters/StickerId'
    post:
      tags: [Stickers]
      summary: 给编辑弹窗的「什么时候用」生成一句
      description: |
        与上传框那个入口的区别只有「图从哪来」：贴纸已入库，服务端自己读文件。同样只回建议、不写库，保存走 PATCH。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                  description: 可省略。省略时用库里存的名字；给了就用表单里的（人往往先改名再点按钮）
      responses:
        '200':
          description: 生成了一句
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StickerUsageSuggestion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 名字为空，或模型这次给不出能用的场景
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '502':
          description: 上游模型没有返回结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
        '503':
          description: 角色还没有可用的模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yiling_session
      description: 登录成功后由服务端下发的 HttpOnly、SameSite=Strict 会话 Cookie。生产环境（HTTPS）额外带 Secure。
  parameters:
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StickerId:
      name: stickerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: 未登录或会话无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 请求参数或请求体无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在或当前会话无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [data, error]
      properties:
        data: {}
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    SessionResponse:
      type: object
      required: [mode, user]
      properties:
        mode:
          type: string
          enum: [session, local-dev, anonymous]
          description: session=有效登录会话；local-dev=仅本地开发且显式允许的开发用户回退；anonymous=未登录。
        reason:
          type: string
          nullable: true
          enum: [missing_session, invalid_session, disabled_user, null]
        user:
          type: object
          nullable: true
          required: [id, username, displayName]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string, nullable: true }
            role:
              type: string
              enum: [ADMIN, USER]
              description: ADMIN=管理员；USER=普通用户。local-dev 模式也返回 ADMIN。
    SessionSummary:
      type: object
      required: [id, current, createdAt, lastUsedAt, expiresAt, device]
      properties:
        id: { type: string, format: uuid }
        current:
          type: boolean
          description: 是否是发起本次请求的会话
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        device:
          type: object
          required: [label, kind]
          properties:
            label: { type: string, description: 由 User-Agent 派生的可读设备名，例如 Windows · Chrome }
            kind:
              type: string
              enum: [desktop, mobile, tablet, unknown]
    AdminUserSummary:
      type: object
      required: [id, username, email, displayName, role, status, createdAt, characterCount, lastActiveAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, USER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        characterCount: { type: integer, minimum: 0 }
        lastActiveAt: { type: string, format: date-time, nullable: true }
    ChannelConnectionSummary:
      type: object
      required: [id, platform, displayName, appId, status, lastEventAt, createdAt, bindings]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        displayName: { type: string }
        appId: { type: string, nullable: true }
        status: { type: string, enum: [CONNECTED, DISCONNECTED, ERROR, DISABLED] }
        lastEventAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true, nullable: true }
        credentials:
          type: object
          nullable: true
          description: 'qq-onebot 解密后的明文凭据，供管理员核对；解不开时为 null'
          properties:
            wsUrl: { type: string }
            httpUrl: { type: string }
            accessToken: { type: string, description: 'WS Token' }
            httpToken: { type: string, description: 'HTTP Token' }
        bindings:
          type: array
          items:
            type: object
            required: [id, characterId, characterName, routingKey]
            properties:
              id: { type: string, format: uuid }
              characterId: { type: string, format: uuid }
              characterName: { type: string }
              routingKey: { type: string, nullable: true, description: '逗号分隔的多个群号；null = 默认绑定。' }
    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          type: object
          required: [id, username, displayName, role]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string, nullable: true }
            role:
              type: string
              enum: [ADMIN, USER]
        expiresAt: { type: string, format: date-time }
    MemoryScope:
      type: object
      required: [id, characterId, scopeType, scopeKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        characterId: { type: string, format: uuid }
        scopeType: { type: string, enum: [character_global, user_private, external_identity] }
        scopeKey: { type: string }
        userId: { type: string, format: uuid, nullable: true }
        externalIdentityId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    ChatMessageInput:
      type: object
      required: [message]
      properties:
        conversationId: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 8000 }
    ChatMessage:
      type: object
      required: [id, role, content, occurredAt, sources]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        occurredAt: { type: string, format: date-time }
        sources:
          type: object
          required: [memories, snapshots]
          properties:
            memories:
              type: array
              items:
                type: object
                required: [id, category, content, scope]
                properties:
                  id: { type: string, format: uuid }
                  category: { type: string }
                  content: { type: string }
                  scope: { type: string, enum: [character, private] }
            snapshots:
              type: array
              items:
                type: object
                required: [id, summary, periodStart, periodEnd, version, scope]
                properties:
                  id: { type: string, format: uuid }
                  summary: { type: string }
                  periodStart: { type: string, format: date-time }
                  periodEnd: { type: string, format: date-time }
                  version: { type: integer }
                  scope: { type: string, enum: [character, private] }
    ConversationInput:
      type: object
      required: [memoryScopeId]
      properties:
        memoryScopeId: { type: string, format: uuid }
        channelBindingId: { type: string, format: uuid, nullable: true }
        externalConversationId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationInput'
        - type: object
          required: [id, characterId, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            characterId: { type: string, format: uuid }
            status: { type: string, enum: [active, archived] }
            lastMessageAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [role, content, occurredAt]
      properties:
        externalMessageId: { type: string, nullable: true }
        role: { type: string, enum: [system, user, assistant, tool] }
        eventType: { type: string, default: message }
        content: { type: string }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageInput'
        - type: object
          required: [id, conversationId, ingestedAt]
          properties:
            id: { type: string, format: uuid }
            conversationId: { type: string, format: uuid }
            ingestedAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [id, type, occurredAt, title]
      properties:
        id: { type: string }
        type: { type: string, enum: [message, memory, snapshot] }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        snapshotVersion: { type: integer, nullable: true }
        details:
          type: object
          additionalProperties: true
    CharacterInput:
      type: object
      required: [name, basePrompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000, description: '线上字段名 personality（基础人设）' }
        styleExamples:
          type: string
          maxLength: 8000
          description: '线上字段名 examples。对话示例，只用来对齐语气：聊天与 QQ/B站 被动回复注入，B站 值班判断不注入。'
        userAddress:
          type: string
          maxLength: 40
          default: '主人'
          description: '线上字段名 userAddress。角色在对话里怎么称呼用户；新建默认「主人」，空字符串表示不特意称呼。目前只在网页 AI 对话注入。'
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
    CharacterPatch:
      type: object
      description: 更新角色时的部分字段；所有字段均为可选。API Key 仅可写入，服务端会加密保存且不会回传。
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000, description: '线上字段名 personality（基础人设）' }
        styleExamples: { type: string, maxLength: 8000, description: '线上字段名 examples（对话示例）' }
        userAddress: { type: string, maxLength: 40, description: '线上字段名 userAddress（角色对你的称呼，可传空字符串取消称呼）' }
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
        chatApiBaseUrl: { type: string, maxLength: 500 }
        chatApiKey: { type: string, maxLength: 8192, writeOnly: true }
        clearApiKey: { type: boolean }
        chatModel: { type: string, maxLength: 120 }
        chatTemperature: { type: number, minimum: 0, maximum: 2 }
        chatMaxTokens: { type: integer, minimum: 256, maximum: 8192 }
        proactive: { $ref: '#/components/schemas/ProactiveSettings' }
        groupInitiative: { $ref: '#/components/schemas/GroupInitiativeSettings' }
    Character:
      allOf:
        - $ref: '#/components/schemas/CharacterInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MemoryItem:
      type: object
      required: [id, category, content, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        category: { type: string }
        content: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED, TRASHED] }
        statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
        deletedAt: { type: string, nullable: true, format: date-time }
        sourceMessageId: { type: string, format: uuid, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    MemorySnapshot:
      type: object
      required: [id, version, periodStart, periodEnd, summary, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        snapshotKey: { type: string }
        scopeId: { type: string, format: uuid }
        kind: { type: string, enum: [automatic, manual] }
        version: { type: integer, minimum: 1 }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        summary: { type: string }
        structuredContent:
          type: object
          properties:
            importantEvents: { type: array, items: { type: object, additionalProperties: true } }
            factsAndPreferences: { type: array, items: { type: object, additionalProperties: true } }
            relationships: { type: array, items: { type: object, additionalProperties: true } }
            commitmentsAndGoals: { type: array, items: { type: object, additionalProperties: true } }
            unresolvedTopics: { type: array, items: { type: object, additionalProperties: true } }
            changesSincePrevious: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [current, superseded] }
        modelMetadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    MemorySettings:
      type: object
      required: [snapshotIntervalDays, activeSnapshotIntervalDays, timezone, autoSnapshotEnabled, rawMessageCleanupEnabled]
      properties:
        snapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 8
          description: 当前表单选择的间隔；若存在待生效值则返回待生效值，否则返回当前生效值
        activeSnapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          readOnly: true
          description: 当前周期实际使用的快照间隔
        pendingSnapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: 下一周期边界生效的快照间隔；立即重算策略下为 null
        timezone: { type: string, example: Asia/Shanghai }
        anchorAt: { type: string, format: date-time, nullable: true }
        nextSnapshotAt: { type: string, format: date-time, nullable: true, readOnly: true }
        rawMessageRetentionDays:
          type: integer
          minimum: 0
          nullable: true
          description: 0 或 null 表示永久保留；期限本身不会自动启用清理
        rawMessageCleanupEnabled:
          type: boolean
          default: false
          description: 是否允许后台清理超过保留期限的原始消息
        autoSnapshotEnabled: { type: boolean, default: true }
        changePolicy:
          type: string
          enum: [NEXT_CYCLE, IMMEDIATE_RECALC]
          default: NEXT_CYCLE
    ProactiveSettings:
      type: object
      description: 写入时只提交要改的字段；读取时一定是归一化后的完整对象。
      required: [enabled, dailyMax, minGapMinutes, quietStart, quietEnd, userActiveMinutes, minConfidence]
      properties:
        enabled:
          type: boolean
          default: false
          description: 默认关。这是唯一一条「她先开口」的路径。
        dailyMax:
          type: integer
          minimum: 0
          maximum: 24
          default: 2
          description: 每天最多主动几条（东八区自然日）；0 等于关掉这个口子。
        minGapMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 180
        quietStart:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '23:00'
          description: 安静时段起点（含）。允许跨午夜。
        quietEnd:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '08:00'
          description: 安静时段终点（不含）。与起点相同会被 400 拒绝。
        userActiveMinutes:
          type: integer
          minimum: 0
          maximum: 720
          default: 30
          description: 你在这个时间内说过话就不打扰；0 = 不判这条。
        minConfidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.4
          description: 挑目的时的置信度门槛。
    GroupInitiativeSettings:
      type: object
      description: |
        QQ 群「冷场了自己找话题」的设置。与 ProactiveSettings 是**两套**：
        私聊的节奏是「这个人」，群里的节奏是「这个群」，共用一个阈值必然有一边是错的。
        写入时只提交要改的字段；读取时一定是归一化后的完整对象。
      required: [enabled, idleMinutes, dailyMax, minGapMinutes, quietStart, quietEnd]
      properties:
        enabled:
          type: boolean
          default: false
          description: 默认关。打开后她会在安静够久的群里自己起个头。
        idleMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 60
          description: 群里安静多少分钟算「冷场」。取「最后一条群消息」与「她最后一次说话」里更近的那个。
        dailyMax:
          type: integer
          minimum: 0
          maximum: 24
          default: 3
          description: 每个群每天最多主动开几次话题（东八区自然日）；0 等于关掉这个口子。
        minGapMinutes:
          type: integer
          minimum: 30
          maximum: 1440
          default: 180
          description: 同一个群两次尝试之间的最小间隔。模型判定「不说」也算一次尝试。
        quietStart:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '23:30'
          description: 安静时段起点（含）。允许跨午夜。
        quietEnd:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '07:30'
          description: 安静时段终点（不含）。与起点相同会被 400 拒绝。
    MemoryJob:
      type: object
      required: [id, type, status, attemptCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        characterId: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time, nullable: true }
        periodEnd: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [queued, running, succeeded, failed, skipped, retry_wait] }
        attemptCount: { type: integer, minimum: 0 }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Sticker:
      type: object
      description: |
        一张表情包。名字与使用场景是挑图模型唯一的判断依据 ——
        进提示词前会先做减法（剔除上一张、封顶 12 条、没用过的优先且其余打乱）。
      required: [id, name, usage, enabled, mimeType, sizeBytes, useCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 60
          description: 情绪或动作词，如「委屈」「拍桌笑」
        usage:
          type: string
          maxLength: 200
          description: 什么时候用。空字符串表示没写，这张基本挑不中
        enabled:
          type: boolean
          description: 停用的图留在列表里，但不会进提示词
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
          description: 缩小后重新编码过的格式，可能与上传时不同
        sizeBytes:
          type: integer
          description: 磁盘上的实际字节数（缩图后已同步，不是原图大小）
        useCount:
          type: integer
          minimum: 0
          description: 被发出去过几次。0 表示还没用过，会排进提示词的最前面
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        source:
          type: string
          enum: [manual, collected, qq]
          description: manual=页面传的；collected=从群里「偷」的；qq=从 QQ 收藏夹同步下来的
        qqEmojiId:
          type: string
          nullable: true
          description: |
            对应的 QQ 收藏表情 id（形如 `<QQ号>_0_0_0_<md5>_0_0`）。
            有值 = 这张在 QQ 收藏夹里也有一份：改名会回写 QQ 备注，删除会连 QQ 一起删。
            `null` = 只在本地（还没推上去，或推失败了）。
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: 进回收站的时间。非空即已删；清单接口不返回这类，只有 `/stickers/trash` 会。
    StickerPatch:
      type: object
      description: 三个字段都可选，但至少要给一个（否则 400）。图不能换，换图请删了重传。
      properties:
        name: { type: string, maxLength: 60 }
        usage: { type: string, maxLength: 200 }
        enabled: { type: boolean }
    QqSideEffect:
      type: object
      description: |
        本地操作已经成功，这一步只是「顺手对 QQ 做的」。
        失败不影响本地结果，也**不该让用户重做**本地那步 —— 下次 `qq-sync` 会补。
      required: [ok]
      properties:
        ok: { type: boolean }
        emojiId:
          type: string
          nullable: true
          description: QQ 收藏 id（推送成功时返回）
        error:
          type: string
          description: 失败原因，直接给用户看的中文
        skipped:
          type: boolean
          description: 'true = 这个角色没绑 QQ 号，不算失败，页面不必弹警告'
    StickerSyncReport:
      type: object
      description: 一次同步做了什么。数字都是 0 时表示两边本来一致。
      required: [ok, connectionId, qqTotal, localTotal, warnings]
      properties:
        ok:
          type: boolean
          description: false = 安全阀触发（QQ 拉到 0 条但本地有一堆挂着的），这次什么都没动
        connectionId: { type: string, format: uuid, description: 同步的是哪个 QQ 号 }
        qqTotal: { type: integer, description: QQ 收藏夹这次拉到多少条 }
        localTotal: { type: integer, description: 本地一共多少行（含回收站） }
        imported: { type: integer, description: 从 QQ 导进来的张数 }
        adopted: { type: integer, description: 导的时候发现本地已有同一张图，改成绑上 QQ 的 id（不重复存图） }
        importedFailed: { type: integer, description: 下载或格式不支持而没导进来的张数，下次会再试 }
        rebound: { type: integer, description: 'QQ 里 id 变了但图没变，重新对上的张数（不重新导入）' }
        restored: { type: integer, description: '回收站里那张又在 QQ 出现，恢复的张数' }
        trashed: { type: integer, description: 'QQ 那边没了、本地进回收站的张数' }
        retriedDelete: { type: integer, description: '本地删过、QQ 还留着，这次补删的张数' }
        retryDeleteFailed: { type: integer, description: 补删失败的张数 }
        pushed: { type: integer, description: 本地推到 QQ 的张数 }
        pushFailed: { type: integer, description: 推送失败的张数 }
        pushMissingFile: { type: integer, description: 本地没有原文件、推不了的张数 }
        namesSynced: { type: integer, description: 把本地名字写进 QQ 备注的条数 }
        nameSyncFailed: { type: integer, description: 备注没写上的条数 }
        importOverflow: { type: integer, description: 本次导入上限之外、留到下次的张数 }
        pushOverflow: { type: integer, description: 本次推送上限之外、留到下次的张数 }
        warnings:
          type: array
          items: { type: string }
          description: 给人看的提示（安全阀、部分失败、还有多少没搬完）。非空时页面按警告展示
    StickerUsageSuggestion:
      type: object
      required: [usage, source]
      properties:
        usage:
          type: string
          maxLength: 200
          description: 一句「什么时候用」，已经裁好首尾空白
        source:
          type: string
          enum: [vision, name]
          description: vision=看了图（名字 + 画面）；name=只凭名字，模型没看到图
    StickerRelabelResult:
      type: object
      required: [skipped]
      properties:
        skipped:
          type: boolean
          description: true 表示模型判定「这不是表情包」，此时**数据没有被改动**
        reason:
          type: string
          enum: [not-a-sticker]
          description: skipped 为 true 时给出原因
        message:
          type: string
          description: skipped 为 true 时的一句人话，可直接展示给用户
        sticker:
          $ref: '#/components/schemas/Sticker'
    RequestError:
      type: object
      description: |
        h3/Nitro 的错误响应体 —— 注意**不是** `{data, error}` 信封，
        只有 statusCode / statusMessage 是稳定的，message 与 url 视情况出现。
      required: [statusCode, statusMessage]
      properties:
        statusCode: { type: integer }
        statusMessage: { type: string }
        message: { type: string }
        url: { type: string }
        error: { type: boolean }
