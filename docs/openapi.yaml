                    updatedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Snapshots]
      summary: 获取快照列表
      parameters:
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 快照分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MemorySnapshot' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Snapshots]
      summary: 生成手动快照或排入自动 AI 快照重新提炼
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshotId:
                  type: string
                  format: uuid
                  description: 可选已有快照 ID。提供后，普通模式会基于该快照创建手动版本；mode=ai 时针对自动快照排入 AI 重新提炼任务。
                mode:
                  type: string
                  enum: [ai]
                  description: 仅设置为 ai 时调用模型并排入 REGENERATE_SNAPSHOT 任务；模型未配置时返回 503。
              additionalProperties: false
      responses:
        '200':
          description: 手动快照已保存或手动版本已创建
          content:
            application/json:
              schema:
                type: object
                required: [id, version]
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
        '202':
          description: AI 重新提炼任务已排队
          content:
            application/json:
              schema:
                type: object
                required: [id, jobId, status, snapshotId, queued, duplicate]
                properties:
                  id: { type: string, format: uuid }
                  jobId: { type: string, format: uuid }
                  status: { type: string, enum: [QUEUED, RUNNING, RETRY_WAIT] }
                  snapshotId: { type: string, format: uuid }
                  queued: { type: boolean }
                  duplicate: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该快照不能以当前模式重新生成
        '503':
          description: 模型未配置
  /snapshots/{snapshotId}:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Snapshots]
      summary: 获取快照版本详情
      responses:
        '200':
          description: 快照详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /snapshots/{snapshotId}/regenerate:
    post:
      tags: [Snapshots]
      summary: 为相同逻辑快照请求生成新版本
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: 新版本生成任务已排队；历史版本保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /snapshots/{snapshotId}/versions:
    get:
      tags: [Snapshots]
      summary: 获取逻辑快照的所有版本
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MemorySnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/memory-settings:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [MemorySettings]
      summary: 获取角色记忆设置
      responses:
        '200':
          description: 设置详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [MemorySettings]
      summary: 更新角色记忆周期和相关设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySettings'
      responses:
        '200':
          description: 设置已更新；周期默认于当前周期结束后生效
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemorySettings' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/proactive:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Proactive]
      operationId: getCharacterProactiveStatus
      summary: 主动找话的现状
      description: |
        返回设置、此刻能不能发（与后台 tick 使用同一把闸门）、待发池条数与最近几条想法。
        设置本身通过 `PATCH /characters/{characterId}` 的 `proactive` 字段写入。
      responses:
        '200':
          description: 设置与状态
          content:
            application/json:
              schema:
                type: object
                required: [settings, status, recent]
                properties:
                  settings: { $ref: '#/components/schemas/ProactiveSettings' }
                  status:
                    type: object
                    required: [sentToday, pendingCount, canSendNow, reason, reasonLabel]
                    properties:
                      sentToday: { type: integer, minimum: 0 }
                      pendingCount: { type: integer, minimum: 0 }
                      recipient:
                        type: string
                        nullable: true
                        description: 脱敏后的收件人；null 表示还没有可投递的 QQ 私聊。
                      lastSentAt: { type: string, format: date-time, nullable: true }
                      gapRemainingMinutes: { type: integer, minimum: 0 }
                      quietNow: { type: boolean }
                      quotaExceeded: { type: boolean }
                      canSendNow: { type: boolean }
                      reason: { type: string }
                      reasonLabel: { type: string, description: 已翻译成中文的原因 }
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [SHARE, ASK, INVITE, CONFIDE, CURIOUS, FOLLOWUP] }
                        goal: { type: string }
                        status: { type: string, enum: [PENDING, SENT, SKIPPED, EXPIRED] }
                        content: { type: string, nullable: true }
                        confidence: { type: number }
                        sentAt: { type: string, format: date-time, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/proactive/try:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    post:
      tags: [Proactive]
      operationId: tryCharacterProactive
      summary: 立即试一次
      description: |
        跳过时间类闸门（安静时段 / 最小间隔 / 主人是否在聊 / 每日上限），
        开关、收件人与当日模型额度仍然照判。会真的往 QQ 发一条私信。
      responses:
        '200':
          description: 本次结果；status=sent 时 content 为发出的正文
          content:
            application/json:
              schema:
                type: object
                required: [status, reason, reasonLabel]
                properties:
                  status: { type: string, enum: [sent, skipped, failed] }
                  reason: { type: string }
                  reasonLabel: { type: string }
                  content: { type: string, nullable: true }
                  detail: { type: string, nullable: true, description: 失败时的原始错误 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: 工作台总览的聚合数据
      description: |
        一次返回总览页所需的全部数据，避免前端按角色逐个请求（N+1）。
        数据范围严格限制在当前会话用户拥有的角色；`admin` 字段仅对管理员返回，其他用户为 null。
        所有时间点都由服务端按角色时区格式化为 `*Label`，客户端不再自行格式化，以免 SSR 与浏览器时区不一致。
        `cycle` 由该角色自己的 `memorySetting.nextSnapshotAt` 与 `snapshotIntervalDays` 推导；
        未开启自动归档或没有排期时返回 null，页面据此不展示周期进度，不使用估算值。
      responses:
        '200':
          description: 总览数据
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, characters, tasks, nextSnapshot, cycle, latestSnapshot, events, admin]
                properties:
                  generatedAt: { type: string, format: date-time }
                  characters:
                    type: array
                    items:
                      type: object
                      required: [id, name, avatar, avatarTone, status, channels, intervalDays, autoSnapshotEnabled, nextSnapshotAt, nextSnapshotLabel, latestSnapshotAt, latestSnapshotLabel, latestSnapshotVersion, memoryCount, cycle, cycleMessageCount, cycleMemoryCount, chatModel, chatApiKeyConfigured, failedTaskCount, pendingTaskCount]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        avatar: { type: string }
                        avatarTone: { type: string, enum: [purple, peach, mint, blue] }
                        status: { type: string, enum: ["运行中", "已暂停", "未连接"] }
                        channels: { type: array, items: { type: string } }
                        intervalDays: { type: integer, minimum: 1 }
                        autoSnapshotEnabled: { type: boolean }
                        nextSnapshotAt: { type: string, nullable: true, format: date-time }
                        nextSnapshotLabel: { type: string, description: "MM-DD HH:mm，或「已暂停」「尚未计划」" }
                        latestSnapshotAt: { type: string, nullable: true, format: date-time }
                        latestSnapshotLabel: { type: string, description: "MM-DD，或「暂无快照」" }
                        latestSnapshotVersion: { type: integer, nullable: true }
                        memoryCount: { type: integer, minimum: 0, description: 活跃长期记忆条数（含角色全局与私人范围） }
                        cycle:
                          nullable: true
                          type: object
                          required: [startISO, endISO, dayIndex, totalDays, missed]
                          properties:
                            startISO: { type: string, format: date-time }
                            endISO: { type: string, format: date-time }
                            dayIndex: { type: integer, minimum: 1 }
                            totalDays: { type: integer, minimum: 1 }
                            missed: { type: boolean, description: 已过 nextSnapshotAt 但快照未生成 }
                        cycleMessageCount: { type: integer, minimum: 0, description: 本周期内的原始消息条数 }
                        cycleMemoryCount: { type: integer, minimum: 0, description: 本周期内新增的活跃记忆条数 }
                        chatModel: { type: string }
                        chatApiKeyConfigured: { type: boolean, description: false 时该角色的快照任务会留在队列中不执行 }
                        failedTaskCount: { type: integer, minimum: 0, description: FAILED + RETRY_WAIT }
                        pendingTaskCount: { type: integer, minimum: 0, description: QUEUED + RUNNING }
                  tasks:
                    type: object
                    required: [pending, failed, items]
                    properties:
                      pending: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, type, status, typeLabel, statusLabel, characterId, characterName, createdAt]
                          properties:
                            id: { type: string, format: uuid }
                            type: { type: string, enum: [GENERATE_SNAPSHOT, REGENERATE_SNAPSHOT, UPDATE_LONG_TERM_MEMORY, CLEAN_EXPIRED_MESSAGES] }
                            status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, RETRY_WAIT, CANCELLED] }
                            typeLabel: { type: string }
                            statusLabel: { type: string }
                            characterId: { type: string, format: uuid }
                            characterName: { type: string }
                            lastError: { type: string, nullable: true }
                            createdAt: { type: string, format: date-time }
                  nextSnapshot:
                    nullable: true
                    type: object
                    description: 所有开启自动归档的角色中最早的一次
                    required: [characterId, characterName, atISO, atLabel, remainingMs]
                    properties:
                      characterId: { type: string, format: uuid }
                      characterName: { type: string }
                      atISO: { type: string, format: date-time }
                      atLabel: { type: string }
                      remainingMs: { type: integer, description: 距该时刻的毫秒数，负数表示已逾期 }
                  cycle:
                    nullable: true
                    type: object
                    description: 以 nextSnapshot 对应角色为准；没有进行中的周期时为 null
                    required: [messageCount, dayIndex, totalDays, endISOLabel]
                    properties:
                      messageCount: { type: integer, minimum: 0, description: 全部角色本周期消息之和 }
                      dayIndex: { type: integer, minimum: 1 }
                      totalDays: { type: integer, minimum: 1 }
                      endISOLabel: { type: string }
                  latestSnapshot:
                    nullable: true
                    type: object
                    required: [id, characterId, characterName, atISO, atLabel, dateLabel, version]
                    properties:
                      id: { type: string, format: uuid }
                      characterId: { type: string, format: uuid }
                      characterName: { type: string }
                      atISO: { type: string, format: date-time }
                      atLabel: { type: string }
                      dateLabel: { type: string, description: "MM-DD" }
                      version: { type: integer, minimum: 1 }
                  events:
                    type: array
                    description: 任务与快照事件按时间倒序合并，最多 8 条
                    items:
                      type: object
                      required: [id, kind, tone, title, meta, atLabel, atISO]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [task, snapshot] }
                        tone: { type: string, enum: [ok, err, wait, run, mute] }
                        title: { type: string }
                        meta: { type: string }
                        atLabel: { type: string }
                        atISO: { type: string, format: date-time }
                  admin:
                    nullable: true
                    type: object
                    description: 仅管理员返回，其他用户为 null
                    required: [database, jobs, channels, recentAudits]
                    properties:
                      database: { type: string, enum: [up, down] }
                      jobs:
                        type: object
                        required: [queued, running, failed, succeeded]
                        properties:
                          queued: { type: integer, minimum: 0 }
                          running: { type: integer, minimum: 0 }
                          failed: { type: integer, minimum: 0 }
                          succeeded: { type: integer, minimum: 0 }
                      channels:
                        type: object
                        required: [total, online]
                        properties:
                          total: { type: integer, minimum: 0 }
                          online: { type: integer, minimum: 0 }
                      recentAudits:
                        type: array
                        items:
                          type: object
                          required: [id, action, entityType, atLabel]
                          properties:
                            id: { type: string, format: uuid }
                            action: { type: string }
                            entityType: { type: string }
                            atLabel: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listMemoryJobs
      summary: 查询当前本地开发用户的持久化后台任务
      description: 本地开发过渡接口；仅返回当前本地开发用户拥有的角色任务，最多返回最近 100 条。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, RETRY_WAIT, CANCELLED]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, status, attemptCount, maxAttempts, runAt, createdAt, updatedAt, characterId, characterName]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string, enum: [GENERATE_SNAPSHOT, REGENERATE_SNAPSHOT, UPDATE_LONG_TERM_MEMORY, CLEAN_EXPIRED_MESSAGES] }
                        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, SKIPPED, RETRY_WAIT, CANCELLED] }
                        attemptCount: { type: integer }
                        maxAttempts: { type: integer }
                        runAt: { type: string, format: date-time }
                        periodStart: { type: string, nullable: true, format: date-time }
                        periodEnd: { type: string, nullable: true, format: date-time }
                        lastError: { type: string, nullable: true }
                        startedAt: { type: string, nullable: true, format: date-time }
                        completedAt: { type: string, nullable: true, format: date-time }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        characterId: { type: string, format: uuid }
                        characterName: { type: string }
                  total: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
  /tasks/scheduler/run:
    post:
      tags: [Tasks]
      operationId: enqueueDueMemoryJobs
      summary: 扫描到期周期并排入持久化任务队列（本地开发）
      description: 处理到期的周期边界并使用幂等键将任务写入持久化队列。真实模型调用由独立 Worker 完成。
      responses:
        '200':
          description: 本次扫描统计
          content:
            application/json:
              schema:
                type: object
                required: [settingsChecked, settingsAdvanced, jobsQueued, periodsConsidered, missingGlobalScope, settingsStillDue, note]
                properties:
                  settingsChecked: { type: integer }
                  settingsAdvanced: { type: integer }
                  jobsQueued: { type: integer }
                  periodsConsidered: { type: integer }
                  missingGlobalScope: { type: integer }
                  settingsStillDue: { type: integer }
                  note: { type: string }
        '403':
          description: 该接口仅限本地开发环境
  /tasks/worker/run:
    post:
      tags: [Tasks]
      operationId: runOneMemoryWorkerJob
      summary: 由本地开发界面执行一条周期快照任务（本地开发）
      description: 手动触发一次 Worker 处理。当前消费 GENERATE_SNAPSHOT 与 REGENERATE_SNAPSHOT 任务；配置 LLM_BASE_URL、LLM_API_KEY 与 LLM_MODEL 后调用 OpenAI-compatible Chat Completions。AI 重新提炼会在同一逻辑快照下创建新版本；提议的长期记忆变化只供审核，不会重放应用到当前记忆。未配置模型时任务留在队列。此接口仅限本地开发环境。
      responses:
        '200':
          description: 本次处理结果；processed=false 表示当前没有可执行的任务
          content:
            application/json:
              schema:
                type: object
                required: [processed, message]
                properties:
                  processed: { type: boolean }
                  jobId: { type: string, format: uuid }
                  status: { type: string, enum: [SUCCEEDED, SKIPPED, RETRY_WAIT, FAILED] }
                  snapshotId: { type: string, format: uuid }
                  message: { type: string }
        '403':
          description: 该接口仅限本地开发环境
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tasks]
      summary: 获取任务详情
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryJob' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/retry:
    post:
      tags: [Tasks]
      operationId: requeueSnapshotTask
      summary: 手动重新排队快照任务（本地开发）
      description: 仅支持 GENERATE_SNAPSHOT / REGENERATE_SNAPSHOT 类型，且任务当前状态为 FAILED、RETRY_WAIT 或 CANCELLED。会将尝试计数重置为 0，并写入审计日志。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 任务已重新排队
          content:
            application/json:
              schema:
                type: object
                required: [id, status, runAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [QUEUED] }
                  runAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务类型或当前状态不允许重新排队
  /tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelQueuedSnapshotTask
      summary: 取消等待中的任务（本地开发）
      description: 仅支持 QUEUED 或 RETRY_WAIT 状态。RUNNING 任务不能被强制取消，以避免与正在进行的 Worker 写事务产生竞态；取消动作写入审计日志。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 任务已取消
          content:
            application/json:
              schema:
                type: object
                required: [id, status, completedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [CANCELLED] }
                  completedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务状态不允许取消
  /channels:
    get:
      tags: [Channels]
      summary: 获取已配置的平台连接
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /characters/{characterId}/channels:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Channels]
      summary: 获取角色绑定的渠道
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yiling_session
      description: 登录成功后由服务端下发的 HttpOnly、SameSite=Strict 会话 Cookie。生产环境（HTTPS）额外带 Secure。
  parameters:
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: 未登录或会话无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: 请求参数或请求体无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在或当前会话无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ApiResponse:
      type: object
      required: [data, error]
      properties:
        data: {}
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    SessionResponse:
      type: object
      required: [mode, user]
      properties:
        mode:
          type: string
          enum: [session, local-dev, anonymous]
          description: session=有效登录会话；local-dev=仅本地开发且显式允许的开发用户回退；anonymous=未登录。
        reason:
          type: string
          nullable: true
          enum: [missing_session, invalid_session, disabled_user, null]
        user:
          type: object
          nullable: true
          required: [id, username, displayName]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string, nullable: true }
            role:
              type: string
              enum: [ADMIN, USER]
              description: ADMIN=管理员；USER=普通用户。local-dev 模式也返回 ADMIN。
    SessionSummary:
      type: object
      required: [id, current, createdAt, lastUsedAt, expiresAt, device]
      properties:
        id: { type: string, format: uuid }
        current:
          type: boolean
          description: 是否是发起本次请求的会话
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        device:
          type: object
          required: [label, kind]
          properties:
            label: { type: string, description: 由 User-Agent 派生的可读设备名，例如 Windows · Chrome }
            kind:
              type: string
              enum: [desktop, mobile, tablet, unknown]
    AdminUserSummary:
      type: object
      required: [id, username, email, displayName, role, status, createdAt, characterCount, lastActiveAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, USER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        characterCount: { type: integer, minimum: 0 }
        lastActiveAt: { type: string, format: date-time, nullable: true }
    ChannelConnectionSummary:
      type: object
      required: [id, platform, displayName, appId, status, lastEventAt, createdAt, bindings]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        displayName: { type: string }
        appId: { type: string, nullable: true }
        status: { type: string, enum: [CONNECTED, DISCONNECTED, ERROR, DISABLED] }
        lastEventAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        bindings:
          type: array
          items:
            type: object
            required: [id, characterId, characterName, routingKey]
            properties:
              id: { type: string, format: uuid }
              characterId: { type: string, format: uuid }
              characterName: { type: string }
              routingKey: { type: string, nullable: true }
    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          type: object
          required: [id, username, displayName, role]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            displayName: { type: string, nullable: true }
            role:
              type: string
              enum: [ADMIN, USER]
        expiresAt: { type: string, format: date-time }
    MemoryScope:
      type: object
      required: [id, characterId, scopeType, scopeKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        characterId: { type: string, format: uuid }
        scopeType: { type: string, enum: [character_global, user_private, external_identity] }
        scopeKey: { type: string }
        userId: { type: string, format: uuid, nullable: true }
        externalIdentityId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    ChatMessageInput:
      type: object
      required: [message]
      properties:
        conversationId: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 8000 }
    ChatMessage:
      type: object
      required: [id, role, content, occurredAt, sources]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        occurredAt: { type: string, format: date-time }
        sources:
          type: object
          required: [memories, snapshots]
          properties:
            memories:
              type: array
              items:
                type: object
                required: [id, category, content, scope]
                properties:
                  id: { type: string, format: uuid }
                  category: { type: string }
                  content: { type: string }
                  scope: { type: string, enum: [character, private] }
            snapshots:
              type: array
              items:
                type: object
                required: [id, summary, periodStart, periodEnd, version, scope]
                properties:
                  id: { type: string, format: uuid }
                  summary: { type: string }
                  periodStart: { type: string, format: date-time }
                  periodEnd: { type: string, format: date-time }
                  version: { type: integer }
                  scope: { type: string, enum: [character, private] }
    ConversationInput:
      type: object
      required: [memoryScopeId]
      properties:
        memoryScopeId: { type: string, format: uuid }
        channelBindingId: { type: string, format: uuid, nullable: true }
        externalConversationId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationInput'
        - type: object
          required: [id, characterId, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            characterId: { type: string, format: uuid }
            status: { type: string, enum: [active, archived] }
            lastMessageAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [role, content, occurredAt]
      properties:
        externalMessageId: { type: string, nullable: true }
        role: { type: string, enum: [system, user, assistant, tool] }
        eventType: { type: string, default: message }
        content: { type: string }
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageInput'
        - type: object
          required: [id, conversationId, ingestedAt]
          properties:
            id: { type: string, format: uuid }
            conversationId: { type: string, format: uuid }
            ingestedAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [id, type, occurredAt, title]
      properties:
        id: { type: string }
        type: { type: string, enum: [message, memory, snapshot] }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        snapshotVersion: { type: integer, nullable: true }
        details:
          type: object
          additionalProperties: true
    CharacterInput:
      type: object
      required: [name, basePrompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000, description: '线上字段名 personality（基础人设）' }
        styleExamples:
          type: string
          maxLength: 8000
          description: '线上字段名 examples。对话示例，只用来对齐语气：聊天与 QQ/B站 被动回复注入，B站 值班判断不注入。'
        userAddress:
          type: string
          maxLength: 40
          default: '主人'
          description: '线上字段名 userAddress。角色在对话里怎么称呼用户；新建默认「主人」，空字符串表示不特意称呼。目前只在网页 AI 对话注入。'
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
    CharacterPatch:
      type: object
      description: 更新角色时的部分字段；所有字段均为可选。API Key 仅可写入，服务端会加密保存且不会回传。
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, nullable: true }
        basePrompt: { type: string, maxLength: 50000, description: '线上字段名 personality（基础人设）' }
        styleExamples: { type: string, maxLength: 8000, description: '线上字段名 examples（对话示例）' }
        userAddress: { type: string, maxLength: 40, description: '线上字段名 userAddress（角色对你的称呼，可传空字符串取消称呼）' }
        modelConfig:
          type: object
          additionalProperties: true
        status: { type: string, enum: [active, paused, archived] }
        chatApiBaseUrl: { type: string, maxLength: 500 }
        chatApiKey: { type: string, maxLength: 8192, writeOnly: true }
        clearApiKey: { type: boolean }
        chatModel: { type: string, maxLength: 120 }
        chatTemperature: { type: number, minimum: 0, maximum: 2 }
        chatMaxTokens: { type: integer, minimum: 256, maximum: 8192 }
    Character:
      allOf:
        - $ref: '#/components/schemas/CharacterInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MemoryItem:
      type: object
      required: [id, category, content, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        category: { type: string }
        content: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED, TRASHED] }
        statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
        deletedAt: { type: string, nullable: true, format: date-time }
        sourceMessageId: { type: string, format: uuid, nullable: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    MemorySnapshot:
      type: object
      required: [id, version, periodStart, periodEnd, summary, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        snapshotKey: { type: string }
        scopeId: { type: string, format: uuid }
        kind: { type: string, enum: [automatic, manual] }
        version: { type: integer, minimum: 1 }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        summary: { type: string }
        structuredContent:
          type: object
          properties:
            importantEvents: { type: array, items: { type: object, additionalProperties: true } }
            factsAndPreferences: { type: array, items: { type: object, additionalProperties: true } }
            relationships: { type: array, items: { type: object, additionalProperties: true } }
            commitmentsAndGoals: { type: array, items: { type: object, additionalProperties: true } }
            unresolvedTopics: { type: array, items: { type: object, additionalProperties: true } }
            changesSincePrevious: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [current, superseded] }
        modelMetadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    MemorySettings:
      type: object
      required: [snapshotIntervalDays, activeSnapshotIntervalDays, timezone, autoSnapshotEnabled, rawMessageCleanupEnabled]
      properties:
        snapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 8
          description: 当前表单选择的间隔；若存在待生效值则返回待生效值，否则返回当前生效值
        activeSnapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          readOnly: true
          description: 当前周期实际使用的快照间隔
        pendingSnapshotIntervalDays:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: 下一周期边界生效的快照间隔；立即重算策略下为 null
        timezone: { type: string, example: Asia/Shanghai }
        anchorAt: { type: string, format: date-time, nullable: true }
        nextSnapshotAt: { type: string, format: date-time, nullable: true, readOnly: true }
        rawMessageRetentionDays:
          type: integer
          minimum: 0
          nullable: true
          description: 0 或 null 表示永久保留；期限本身不会自动启用清理
        rawMessageCleanupEnabled:
          type: boolean
          default: false
          description: 是否允许后台清理超过保留期限的原始消息
        autoSnapshotEnabled: { type: boolean, default: true }
        changePolicy:
          type: string
          enum: [NEXT_CYCLE, IMMEDIATE_RECALC]
          default: NEXT_CYCLE
    ProactiveSettings:
      type: object
      description: 写入时只提交要改的字段；读取时一定是归一化后的完整对象。
      required: [enabled, dailyMax, minGapMinutes, quietStart, quietEnd, userActiveMinutes, minConfidence]
      properties:
        enabled:
          type: boolean
          default: false
          description: 默认关。这是唯一一条「她先开口」的路径。
        dailyMax:
          type: integer
          minimum: 0
          maximum: 24
          default: 2
          description: 每天最多主动几条（东八区自然日）；0 等于关掉这个口子。
        minGapMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 180
        quietStart:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '23:00'
          description: 安静时段起点（含）。允许跨午夜。
        quietEnd:
          type: string
          pattern: '^\d{1,2}:\d{2}$'
          default: '08:00'
          description: 安静时段终点（不含）。与起点相同会被 400 拒绝。
        userActiveMinutes:
          type: integer
          minimum: 0
          maximum: 720
          default: 30
          description: 你在这个时间内说过话就不打扰；0 = 不判这条。
        minConfidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.4
          description: 挑目的时的置信度门槛。
    MemoryJob:
      type: object
      required: [id, type, status, attemptCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        characterId: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time, nullable: true }
        periodEnd: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [queued, running, succeeded, failed, skipped, retry_wait] }
        attemptCount: { type: integer, minimum: 0 }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
