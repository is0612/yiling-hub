                  type: string
                  format: uuid
                  description: 可选已有快照 ID。提供后，普通模式会基于该快照创建手动版本；mode=ai 时针对自动快照排入 AI 重新提炼任务。
                mode:
                  type: string
                  enum: [ai]
                  description: 仅设置为 ai 时调用模型并排入 REGENERATE_SNAPSHOT 任务；模型未配置时返回 503。
              additionalProperties: false
      responses:
        '200':
          description: 手动快照已保存或手动版本已创建
          content:
            application/json:
              schema:
                type: object
                required: [id, version]
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
        '202':
          description: AI 重新提炼任务已排队
          content:
            application/json:
              schema:
                type: object
                required: [id, jobId, status, snapshotId, queued, duplicate]
                properties:
                  id: { type: string, format: uuid }
                  jobId: { type: string, format: uuid }
                  status: { type: string, enum: [QUEUED, RUNNING, RETRY_WAIT] }
                  snapshotId: { type: string, format: uuid }
                  queued: { type: boolean }
                  duplicate: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该快照不能以当前模式重新生成
        '503':
          description: 模型未配置
  /characters/{characterId}/snapshots/{snapshotId}/review:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
      - name: snapshotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Snapshots]
      summary: 逐条采纳或忽略重新提炼提出的长期记忆建议
      description: |
        只处理 `result = NOT_APPLIED_REGENERATION` 且尚未处置过的条目。
        采纳复用与周期任务相同的落库逻辑（去重、来源消息、审计），
        忽略只记录决定、不改动任何记忆。处置结果存在 memory_reviews，不回写快照。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeIndex, decision]
              properties:
                changeIndex:
                  type: integer
                  minimum: 0
                  description: 对应快照 structuredContent.memoryChangesApplied 的数组下标
                decision:
                  type: string
                  enum: [ACCEPT, IGNORE]
              additionalProperties: false
      responses:
        '200':
          description: 已处置
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, changeIndex, decision]
                properties:
                  snapshotId: { type: string, format: uuid }
                  changeIndex: { type: integer }
                  decision: { type: string, enum: [ACCEPTED, IGNORED] }
                  outcome:
                    type: string
                    nullable: true
                    enum: [CREATED, REPLACED, INVALIDATED, DUPLICATE_IGNORED, null]
                    description: 采纳的实际结果；忽略时为 null
                  memoryItemId: { type: string, format: uuid, nullable: true }
                  supersededMemoryId: { type: string, format: uuid, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 条目已处置过、不是待审核状态，或指向的记忆已被后续归档改动（此时只能忽略）
