  /characters/{characterId}/memories:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 检索角色的长期记忆（关键词 + 分类 + 状态，游标分页）
      description: 时间线只载最近数百条，这个接口走全库检索。按 `(updatedAt, id)` 做 keyset 分页：记忆会不断更新，用 offset 会漏条目或重复，所以游标是不透明字符串，客户端原样回传即可。非法 `category` / `status` / `scope` 视为未传，不报错。响应是裸对象，不套 `ApiResponse` 外壳（与 `/timeline` 一致）。
      parameters:
        - name: q
          in: query
          description: 按内容做不区分大小写的子串匹配。
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
        - name: status
          in: query
          description: 不传则排除回收站（TRASHED）。
          schema: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED, TRASHED] }
        - name: scope
          in: query
          schema: { type: string, enum: [CHARACTER_GLOBAL, USER_PRIVATE, EXTERNAL_IDENTITY] }
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor，原样回传。
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: 记忆检索结果
          content:
            application/json:
              schema:
                type: object
                required: [items, total, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, category, content, status, scopeType, importance, createdAt, updatedAt]
                      properties:
                        id: { type: string, format: uuid }
                        category: { type: string }
                        content: { type: string }
                        status: { type: string }
                        scopeType: { type: string, enum: [CHARACTER_GLOBAL, USER_PRIVATE, EXTERNAL_IDENTITY] }
                        importance: { type: number }
                        validTo: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  total:
                    type: integer
                    description: 当前筛选条件下的总条数（不受游标影响）。
                  nextCursor:
                    type: string
                    nullable: true
                    description: 没有下一页时为 null。
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Memories]
      operationId: createCharacterMemory
      summary: 手动创建长期记忆（本地开发）
      description: 仅限 localhost 的开发过渡接口；创建的条目默认 ACTIVE，并立即显示在角色时间线中。scope 为 character 时写入角色全局记忆范围，为该角色所有对话共享；为 private 时写入当前开发用户的私人记忆范围，只在该用户与这个角色对话时参与检索。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, category]
              properties:
                content: { type: string, minLength: 1 }
                category: { type: string, enum: [FACT, PREFERENCE, RELATIONSHIP, COMMITMENT, GOAL, EVENT, SUMMARY, OTHER] }
                scope: { type: string, enum: [character, private], default: character }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MemoryItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 该接口仅限本地开发环境
  /memories/{memoryId}/trash:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Memories]
      operationId: moveMemoryToTrash
      summary: 将长期记忆移入回收站（本地开发）
      description: 保留移入前的状态与时间戳；已有快照保持不变。
      responses:
        '200':
          description: 已移入回收站
          content:
            application/json:
              schema:
                type: object
                required: [id, status, statusBeforeTrash, deletedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [TRASHED] }
                  statusBeforeTrash: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  deletedAt: { type: string, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 记忆已在回收站
  /memories/{memoryId}/restore:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Memories]
      operationId: restoreMemoryFromTrash
      summary: 从回收站恢复长期记忆（本地开发）
      description: 恢复到移入回收站之前的记忆状态。
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                type: object
                required: [id, status, statusBeforeTrash, deletedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  statusBeforeTrash: { type: string, nullable: true, enum: [ACTIVE, SUPERSEDED, ARCHIVED, INVALIDATED] }
                  deletedAt: { type: string, nullable: true, format: date-time }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 记忆不在回收站
  /memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
