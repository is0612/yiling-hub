          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 会话分页消息、总数与已保存的记忆来源
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, title, status, page, pageSize, total, messages]
                properties:
                  conversationId: { type: string, format: uuid }
                  title: { type: string }
                  status: { type: string, enum: [ACTIVE, ARCHIVED] }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: 分页参数无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Characters]
      operationId: setCharacterChatConversationStatus
      summary: 归档或恢复角色会话
      description: 本地开发功能。归档只改变会话状态，不删除对话消息或模型来源记录，并写入审计日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, ARCHIVED] }
      responses:
        '200':
          description: 会话状态已更新
          content:
            application/json:
              schema:
                type: object
                required: [id, status, updatedAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [ACTIVE, ARCHIVED] }
                  updatedAt: { type: string, format: date-time }
        '400':
          description: status 参数无效
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Characters]
      operationId: deleteCharacterChatConversation
      summary: 永久删除角色会话
      description: >-
        本地开发功能。硬删除会话及其全部消息，无法恢复，并写入审计日志（`CONVERSATION_DELETED`）。
        **记忆不受影响**：记忆条目与快照挂在记忆范围下、不隶属会话，`MemoryItem.sourceMessageId` 与
        `MemorySnapshotSource.messageId` 都是 `onDelete: SetNull`，删消息只会清空「来源是哪条消息」的指针。
        只处理桌面端对话（`channelBindingId` 为空），QQ 等渠道会话由渠道侧管理，从这里删会 404。
        响应里的 `retainedMemories` / `retainedSnapshotSources` 是删除后仍保留在记忆侧的条数，用于向用户说明。
        `retainedMemories` 只数「直接引用本会话消息」的条目，**不包含**经由快照再派生出来的记忆
        （那类条目 `sourceMessageId` 本来就是空的），所以它是下限而非全量。
      responses:
        '200':
          description: 会话已删除，返回删除量与此前沉淀的记忆条数
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, title, deletedMessages, memoriesPreserved, retainedMemories, retainedSnapshotSources]
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
                  title: { type: string, nullable: true }
                  deletedMessages: { type: integer }
                  memoriesPreserved: { type: boolean, description: 恒为 true：记忆侧未被删除，仅来源指针置空 }
                  retainedMemories: { type: integer, description: 仍保留在记忆页的相关记忆条目数（不含回收站） }
                  retainedSnapshotSources: { type: integer, description: 仍保留的相关快照来源记录数 }
        '403':
          description: 浏览器请求的 Origin / Sec-Fetch-Site 与当前主机不一致，或未登录
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该角色尚未建立全局记忆范围
  /characters/{characterId}/timeline:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      operationId: getCharacterMemoryTimeline
      summary: 获取角色的已保存记忆时间线
      description: 本地开发过渡接口。返回数据库中已保存的消息、长期记忆和快照；本机可手动录入记忆与纯文本对话。外部渠道接入、事件自动提炼和模型总结尚未接入。默认返回全部种类，`kinds` 可按需裁剪（记忆页只取 memory,snapshot，把额度让给记忆）；`counts` 始终是数据库全量计数，与本次裁剪和条数上限无关。
      parameters:
        - name: kinds
          in: query
          description: 逗号分隔的种类子集，可选值 message / memory / snapshot；留空或非法值按全部处理。
          schema: { type: string, example: "memory,snapshot" }
        - name: limit
          in: query
          description: 返回条数上限，默认 300，最大 500。
          schema: { type: integer, default: 300, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: 按时间倒序排列的真实时间线记录，附全量计数
          content:
            application/json:
              schema:
                type: object
                required: [entries, counts]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, type, title, summary, time, channel, tag, tagTone, source]
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [message, memory, snapshot, event] }
                        title: { type: string }
                        summary: { type: string }
                        time: { type: string }
                        channel: { type: string }
                        tag: { type: string }
                        tagTone: { type: string, enum: [green, purple, blue, amber, gray] }
                        source: { type: string }
                  counts:
                    type: object
                    required: [message, event, memory, snapshot]
                    properties:
                      message: { type: integer }
                      event: { type: integer }
                      memory: { type: integer }
                      snapshot: { type: integer }
        '403':
          description: 该接口仅限本地开发环境
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/group-chats:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      operationId: listCharacterGroupChats
      summary: 获取角色在 QQ 群里的聊天记录
      description: 群聊会话挂在角色全局记忆范围下，本来就算她的记忆，但记忆页的时间线只取长期记忆与阶段总结，原始消息不进这条流。本接口按 `g:<群号>` 的会话键单独列出群聊：`groups` 是群列表（含群号、条数、最后发言时间），`messages` 是选中群最近 120 条往来消息（含发言人昵称；昵称缺失时给群内成员代号）。只返回当前用户拥有的角色，私聊会话不从这条路径暴露。
      parameters:
        - name: conversationId
          in: query
          description: 选中的群会话 id；不传时返回最近活跃的那个群。
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 群列表与选中群的最近消息
          content:
            application/json:
              schema:
                type: object
                required: [groups, selectedConversationId, messages, totals]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [conversationId, groupId, label, lastMessageAt, updatedAt, messageCount, connectionName]
                      properties:
                        conversationId: { type: string, format: uuid }
                        groupId: { type: string, nullable: true, description: 群号；老数据或非群会话可能为空。 }
                        label: { type: string, example: "QQ群 12345678" }
                        lastMessageAt: { type: string, format: date-time, nullable: true }
                        updatedAt: { type: string, format: date-time }
                        messageCount: { type: integer }
                        connectionName: { type: string, nullable: true }
                  selectedConversationId: { type: string, format: uuid, nullable: true }
                  messages:
                    type: array
                    items:
                      type: object
                      required: [id, role, content, occurredAt, author, member]
                      properties:
                        id: { type: string, format: uuid }
                        role: { type: string, enum: [USER, ASSISTANT, SYSTEM, TOOL] }
                        content: { type: string }
                        occurredAt: { type: string, format: date-time }
                        author: { type: string, nullable: true, description: 群友昵称；她自己的消息为 null。 }
                        member: { type: string, nullable: true, description: 群内成员代号（member_n），昵称缺失时用它兜底。 }
                  totals:
                    type: object
                    required: [groups, messages]
                    properties:
                      groups: { type: integer }
                      messages: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /characters/{characterId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Memories]
      summary: 获取角色的会话列表
      parameters:
        - name: scopeId
