name: 项目校验

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "app/**"
      - "server/**"
      - "scripts/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - ".env.example"
      - "README.md"
      - ".github/workflows/phase-0-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "scripts/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - ".env.example"
      - "README.md"
      - ".github/workflows/phase-0-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yiling_hub
          POSTGRES_USER: yiling_hub
          POSTGRES_PASSWORD: phase0_validation_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yiling_hub -d yiling_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yiling_hub:phase0_validation_only@127.0.0.1:5432/yiling_hub?schema=public
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 校验 Prisma Schema
        run: npm run db:validate

      - name: 生成 Prisma Client
        run: npm run db:generate

      - name: 应用初始数据库迁移
        run: npm run db:migrate:deploy

      - name: 检查迁移与 Schema 一致
        run: npx prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --exit-code

      - name: 准备 Nuxt 类型与组件信息
        run: npx nuxt prepare

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 检查
        run: npm run lint

      - name: Nuxt 生产构建
        run: npm run build

      - name: 检查 OpenAPI 契约
        run: npx --yes @redocly/cli@latest lint --extends=minimal docs/openapi.yaml
