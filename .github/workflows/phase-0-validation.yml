name: 项目校验

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "app/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - ".github/workflows/phase-0-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - ".github/workflows/phase-0-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://yiling_hub:phase0_validation_only@127.0.0.1:5432/yiling_hub?schema=public
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 校验 Prisma Schema
        run: npm run db:validate

      - name: 生成初始迁移 SQL（临时审查工件）
        run: npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output /tmp/prisma-init-migration.sql

      - uses: actions/upload-artifact@v4
        with:
          name: prisma-init-migration
          path: /tmp/prisma-init-migration.sql
          retention-days: 1

      - name: 生成 Prisma Client
        run: npm run db:generate

      - name: 准备 Nuxt 类型与组件信息
        run: npx nuxt prepare

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 检查
        run: npm run lint

      - name: Nuxt 生产构建
        run: npm run build

      - name: 检查 OpenAPI 契约
        run: npx --yes @redocly/cli@latest lint --extends=minimal docs/openapi.yaml
