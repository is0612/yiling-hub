name: Phase 0 schema validation

on:
  pull_request:
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "docs/openapi.yaml"
      - "package.json"
      - ".github/workflows/phase-0-validation.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - "package.json"
      - ".github/workflows/phase-0-validation.yml"

jobs:
  validate-prisma:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://yiling_hub:phase0_validation_only@127.0.0.1:5432/yiling_hub?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint --extends=minimal docs/openapi.yaml
