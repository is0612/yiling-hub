name: 项目校验

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "app/**"
      - "server/**"
      - "scripts/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - "yarn.lock"
      - ".env.example"
      - "README.md"
      - ".github/workflows/phase-0-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "server/**"
      - "scripts/**"
      - "nuxt.config.ts"
      - "eslint.config.mjs"
      - "prisma/**"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "docs/openapi.yaml"
      - "package.json"
      - "yarn.lock"
      - ".env.example"
      - "README.md"
      - ".github/workflows/phase-0-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yiling_hub
          POSTGRES_USER: yiling_hub
          POSTGRES_PASSWORD: phase0_validation_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yiling_hub -d yiling_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yiling_hub:phase0_validation_only@127.0.0.1:5432/yiling_hub?schema=public
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 固定 Yarn Classic 版本
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 校验 Prisma Schema
        run: yarn run db:validate

      - name: 生成 Prisma Client
        run: yarn run db:generate

      - name: 应用初始数据库迁移
        run: yarn run db:migrate:deploy

      - name: 检查迁移与 Schema 一致
        run: yarn prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --exit-code

      - name: 准备 Nuxt 类型与组件信息
        run: yarn nuxt prepare

      - name: TypeScript 类型检查
        run: yarn run typecheck

      - name: 周期记忆调度单元测试
        run: yarn run test:scheduler

      - name: ESLint 检查
        run: yarn run lint

      - name: 初始化 CI 本地开发用户
        env:
          DEV_OWNER_ID: 00000000-0000-4000-8000-000000000001
          DEV_OWNER_USERNAME: ci-local
          DEV_OWNER_PASSWORD: CI_smoke_test_password_123
        run: yarn run db:seed:dev

      - name: 验证角色与记忆设置 API 的数据库持久化
        env:
          NODE_ENV: development
          YILING_LOCAL_API_ENABLED: "true"
          DEV_OWNER_ID: 00000000-0000-4000-8000-000000000001
          DEV_OWNER_USERNAME: ci-local
          DEV_OWNER_PASSWORD: CI_smoke_test_password_123
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          yarn run dev --host 127.0.0.1 --port 3000 > /tmp/yiling-nuxt.log 2>&1 &
          server_pid=$!
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/yiling-nuxt.log; fi; exit "$status"' EXIT
          node scripts/smoke-test-local-api.mjs

      - name: Nuxt 生产构建
        run: yarn run build

      - name: 检查 OpenAPI 契约
        run: npx --yes @redocly/cli@latest lint --extends=minimal docs/openapi.yaml
