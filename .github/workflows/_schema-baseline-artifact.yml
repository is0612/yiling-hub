name: Temporary Prisma baseline artifact

on:
  push:
    branches: [docs/project-blueprint]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://yiling_hub:baseline_only@127.0.0.1:5432/yiling_hub?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate schema
        run: npm run db:validate
      - name: Generate SQL baseline
        run: npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output /tmp/migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: prisma-init-migration
          path: /tmp/migration.sql
          if-no-files-found: error
          retention-days: 1
